name: Consolidate remaining patch layers
on:
  push:
    branches: [cleanup/consolidate-fixes]
permissions:
  contents: write
jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[fix-clean]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fold patch layers into core files
        shell: bash
        run: |
          set -euo pipefail

          # JS boot/UI fixes become part of app.js so they are maintained with the game shell.
          for f in arena-start-fix.js home-screen-fix.js startup-fix.js; do
            test -f "$f"
            printf '\n\n/* ===== CONSOLIDATED: %s ===== */\n' "$f" >> app.js
            cat "$f" >> app.js
          done

          # Audio mode routing depends on HVAudio, so keep it directly after the audio core.
          printf '\n\n/* ===== CONSOLIDATED: audio-mode.js ===== */\n' >> audio.js
          cat audio-mode.js >> audio.js

          # CSS overrides preserve their historical cascade order when moved to the end
          # of the main stylesheet.
          for f in ui-fixes.css mobile-polish.css; do
            test -f "$f"
            printf '\n\n/* ===== CONSOLIDATED: %s ===== */\n' "$f" >> style.css
            cat "$f" >> style.css
          done

          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          for name in [
              'ui-fixes.css', 'mobile-polish.css',
              'audio-mode.js', 'arena-start-fix.js',
              'home-screen-fix.js', 'startup-fix.js'
          ]:
              import re
              s = re.sub(r'\n?<link rel="stylesheet" href="'+re.escape(name)+r'(?:\?v=[^"]+)?">', '', s)
              s = re.sub(r'\n?<script src="'+re.escape(name)+r'(?:\?v=[^"]+)?"></script>', '', s)
          p.write_text(s)
          PY

          rm -f arena-start-fix.js home-screen-fix.js startup-fix.js
          rm -f audio-mode.js
          rm -f ui-fixes.css mobile-polish.css

          # Keep the remaining files as feature modules, not patches.
          test -f deckbuilder.js
          test -f combat-presentation.js
          test -f audio.js

          # No patch/compatibility files may remain in the root.
          if find . -maxdepth 1 -type f \( -name '*-fix.js' -o -name '*-fix.css' -o -name '*-patch.js' -o -name '*-patch.css' \) | grep -q .; then
            echo 'Patch/fix files remain.'
            find . -maxdepth 1 -type f \( -name '*-fix.js' -o -name '*-fix.css' -o -name '*-patch.js' -o -name '*-patch.css' \)
            exit 1
          fi

          if grep -R -n --exclude-dir=.git -E '<script[^>]+(audio-mode|arena-start-fix|home-screen-fix|startup-fix)\.js|<link[^>]+(ui-fixes|mobile-polish)\.css' .; then
            echo 'Removed patch files are still referenced.'
            exit 1
          fi

          node --check app.js
          node --check audio.js
          node --check engine.js
          node --check deckbuilder.js
          node --check combat-presentation.js

          python3 - <<'PY'
          import json
          with open('cards.json', encoding='utf-8') as f:
              data=json.load(f)
          ids=[c['id'] for c in data['cards']]
          assert len(ids)==len(set(ids)), 'duplicate card ids'
          assert len(ids) >= 40, f'unexpectedly low card count: {len(ids)}'
          print('cards:', len(ids))
          PY

          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Consolidate remaining patch layers into core files [fix-clean]'
          git push origin cleanup/consolidate-fixes
