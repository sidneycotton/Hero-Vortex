name: Generate Ajax GLB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Generate GLB
        run: python3 tools/generate_ajax_glb.py

      - name: Commit generated GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/ajax/ajax.glb
          if git diff --cached --quiet; then
            echo "GLB already up to date"
            exit 0
          fi
          git commit -m "Generate Ajax GLB [skip ci]"
          git push origin HEAD:main
