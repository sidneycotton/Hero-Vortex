name: Hero Vortex Visual Pass
on:
  push:
    branches: [refactor/visual-density-pass]
permissions:
  contents: write
jobs:
  visual-pass:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[visual-pass]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply visual system and audit card data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          # Future artwork contract: every rendered card exposes a deterministic asset key.
          p = Path('js/ui/render.js')
          s = p.read_text()
          if 'data-art-src=' not in s:
              s = s.replace(
                  '<div class="hv-card-detail ${selected?\'is-selected\':\'\'}">',
                  '<div class="hv-card-detail ${selected?\'is-selected\':\'\'}" data-card-id="${id}" data-art-src="${c.image||`assets/heroes/${c.id}.webp`}">' 
              )
              s = s.replace(
                  '<div class="unit-card ${deadClass} ${selClass} ${spawnClass}" data-uid="${u.uid}"',
                  '<div class="unit-card ${deadClass} ${selClass} ${spawnClass}" data-card-id="${u.cardId}" data-art-src="${def.image||`assets/heroes/${u.cardId}.webp`}" data-uid="${u.uid}"'
              )
          p.write_text(s)

          # Add a single, documented visual layer at the end of the existing stylesheet.
          css = Path('style.css')
          current = css.read_text()
          marker = '/* ===== VISUAL SYSTEM: SPACING / HIERARCHY / RESPONSIVE ===== */'
          if marker not in current:
              visual = r'''

/* ===== VISUAL SYSTEM: SPACING / HIERARCHY / RESPONSIVE ===== */
:root{
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:20px;
  --space-6:24px;
  --space-7:32px;
  --content-max:1440px;
  --panel-radius:14px;
  --card-radius:14px;
  --section-gap:16px;
}
#app{max-width:var(--content-max);padding:22px 20px 56px}
.hv-battle-screen{width:min(var(--content-max),100%);gap:14px}
.hv-battle-topbar{min-height:64px;padding:0 4px 10px}
.hv-queue-strip{min-height:48px;padding:7px 10px;gap:8px}
.hv-battle-stage{grid-template-rows:minmax(280px,1fr) 42px minmax(280px,1fr);min-height:650px}
.hv-battle-stage .player-zone{min-height:280px}
.hv-battle-stage .unit-row{gap:16px;min-height:210px}
.hv-battle-stage .unit-card{min-height:210px;padding:14px 15px;border-radius:var(--card-radius)}
.unit-header-line{min-height:34px;gap:9px}
.unit-name{line-height:1.12}
.unit-lifebar{margin-top:9px}
.unit-maxlife-sub{margin-top:4px}
.unit-passive-panel,.unit-statuses,.unit-counters{margin-top:9px}
.unit-passive-text,.ability-text{line-height:1.42}
.unit-abilities{gap:7px;margin-top:10px}
.ability-btn{min-height:44px;padding:8px 10px}
.hv-battle-log{height:120px;padding:11px 14px}
.hv-deck-workbench{gap:22px}
.hv-deck-catalog{padding:20px}
.hv-deck-grid{gap:12px}
.hv-deck-card{min-height:205px;padding:16px;gap:8px 10px}
.hv-card-detail{padding:22px;min-height:580px}
.hv-detail-abilities{gap:10px}
.hv-detail-ability{padding:11px 12px}

/* Secondary information should breathe without competing with the hero identity. */
.unit-statuses,.unit-counters{display:flex;flex-wrap:wrap;gap:5px}
.status-chip,.counter-chip{font-size:.62rem;padding:4px 7px;border-radius:999px}

/* Keep long rules readable instead of letting them create dense walls of text. */
.unit-passive-text,.ability-text,.hv-detail-ability-text{max-width:58ch}

@media (max-width:980px){
  #app{padding:18px 14px 44px}
  .hv-battle-stage{grid-template-rows:minmax(250px,1fr) 36px minmax(250px,1fr);min-height:590px}
  .hv-battle-stage .player-zone{min-height:250px}
  .hv-battle-stage .unit-row{gap:10px}
  .hv-battle-stage .unit-card{min-height:195px}
  .hv-deck-workbench{grid-template-columns:minmax(0,1fr) minmax(300px,.7fr);gap:14px}
}

@media (max-width:720px){
  #app{padding:14px 10px 36px}
  .hv-battle-screen{gap:10px}
  .hv-battle-topbar{min-height:58px;padding-bottom:8px}
  .hv-queue-strip{overflow-x:auto;scrollbar-width:none}
  .hv-queue-strip::-webkit-scrollbar{display:none}
  .hv-battle-stage{grid-template-rows:auto 30px auto;min-height:0}
  .hv-battle-stage .player-zone{min-height:0}
  .hv-battle-stage .unit-row{grid-template-columns:1fr;gap:10px;min-height:0}
  .hv-battle-stage .unit-card{min-height:0;padding:12px}
  .hv-battle-log{height:94px}
  .hv-deck-workbench{grid-template-columns:1fr}
  .hv-deck-inspector{position:relative;top:auto}
  .hv-deck-grid{grid-template-columns:1fr}
  .hv-deck-card{min-height:170px}
  .hv-card-detail{min-height:0;padding:18px}
}
'''
              css.write_text(current.rstrip()+visual+'\n')

          # Card data integrity audit.
          d=json.loads(Path('cards.json').read_text())
          cards=d.get('cards')
          assert isinstance(cards,list), 'cards.json.cards must be an array'
          ids=[c.get('id') for c in cards]
          assert all(ids), 'every card must have an id'
          assert len(ids)==len(set(ids)), 'duplicate card ids found'
          bad=[]
          roles={}
          for c in cards:
              if not isinstance(c.get('name'),str) or not c.get('name').strip(): bad.append((c.get('id'),'name'))
              if not isinstance(c.get('role'),str) or not c.get('role').strip(): bad.append((c.get('id'),'role'))
              if not isinstance(c.get('life'),(int,float)): bad.append((c.get('id'),'life'))
              if not isinstance(c.get('abilities'),list): bad.append((c.get('id'),'abilities'))
              roles[c['role']]=roles.get(c['role'],0)+1
              for i,a in enumerate(c.get('abilities',[])):
                  if not isinstance(a,dict): bad.append((c.get('id'),f'ability[{i}]'))
          assert not bad, f'card schema problems: {bad[:10]}'
          print(f'Card audit passed: {len(cards)} cards, roles={roles}')
          PY

          node --check app.js
          for f in js/core/engine.js js/core/game-state.js js/core/game-flow.js js/ui/render.js js/ui/deckbuilder-screen.js js/systems/audio.js js/systems/combat-presentation.js js/systems/deckbuilder.js; do node --check "$f"; done
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['js/core/engine.js','js/app.js','js/core/game-state.js','js/core/game-flow.js','js/ui/render.js','js/ui/deckbuilder-screen.js','js/systems/deckbuilder.js','js/systems/audio.js','js/systems/combat-presentation.js']
          # The expected script paths are currently in index.html; avoid silently drifting them.
          assert all(x in s for x in required), 'index.html missing a required JS path'
          print('index.js dependency audit passed')
          PY

          git rm .github/workflows/visual-pass.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refine visual density and card rendering contract [visual-pass]'
          git push origin refactor/visual-density-pass
