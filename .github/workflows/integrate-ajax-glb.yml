name: Integrate Ajax GLB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game.html'
      - 'index.html'
      - 'js/**'
      - '*.glb'

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[ajax-glb-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ajax model and rename entrypoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/characters/ajax

          model=$(find . -maxdepth 1 -type f -name '*.glb' -print -quit || true)
          if [ -n "$model" ] && [ ! -f assets/characters/ajax/ajax.glb ]; then
            git mv "$model" assets/characters/ajax/ajax.glb
          fi

          if [ ! -f assets/characters/ajax/ajax.glb ]; then
            echo 'Ajax GLB not found' >&2
            exit 1
          fi

          if [ -f game.html ] && [ ! -f index.html ]; then
            git mv game.html index.html
          fi

          if [ ! -f index.html ]; then
            echo 'index.html not found after rename' >&2
            exit 1
          fi

          if ! grep -q '<!-- AJAX_GLB_RUNTIME -->' index.html; then
            sed -i 's#</body>#<!-- AJAX_GLB_RUNTIME -->\n<script src="js/ajax-glb-runtime.js"></script>\n</body>#' index.html
          fi

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'Integrate real Ajax GLB and rename entrypoint [ajax-glb-integrated]'
          git push
