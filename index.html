<style>
  :root {
    --panel-bg: rgba(10,12,20,0.92);
    --accent: #6ee7ff;
    --player: #4fd1c5;
    --enemy: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05060a; color: #e8eefc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #canvas-wrap { position: relative; flex: 1 1 auto; min-height: 0; }
  #canvas-wrap canvas { display: block; width: 100%; height: 100%; }

  /* Floating name/HP labels over units */
  #label-layer { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .unit-label {
    position: absolute; transform: translate(-50%, -100%);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-width: 64px; pointer-events: none; transition: opacity 0.2s;
  }
  .unit-label .name {
    font-size: 10px; font-weight: 700; letter-spacing: 0.3px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    color: #fff;
  }
  .unit-label.dead .name { opacity: 0.35; text-decoration: line-through; }
  .hp-bar-bg {
    width: 60px; height: 7px; border-radius: 4px;
    background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.25);
    overflow: hidden;
  }
  .hp-bar-fill { height: 100%; border-radius: 3px; transition: width 0.35s ease; }
  .hp-bar-fill.player { background: linear-gradient(90deg,#2dd4bf,#4fd1c5); }
  .hp-bar-fill.enemy { background: linear-gradient(90deg,#f87171,#ff6b6b); }
  .hp-text { font-size: 9px; color: #cfe8ff; text-shadow: 0 1px 2px rgba(0,0,0,0.9); }
  .shield-pip {
    font-size: 9px; color: #ffe27a; text-shadow: 0 1px 2px rgba(0,0,0,0.9);
  }
  .status-row {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 3px;
    max-width: 90px;
  }
  .status-pip {
    font-size: 8px; line-height: 1; padding: 2px 4px; border-radius: 8px;
    background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.25);
    color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.9); white-space: nowrap;
  }
  .status-pip.status-kind-bleed { border-color: rgba(255,107,107,0.7); color: #ffb0b0; }
  .status-pip.counter-pip { border-color: rgba(255,226,122,0.7); color: #ffe27a; }
  .selected-ring {
    position: absolute; width: 78px; height: 78px; border-radius: 50%;
    border: 2px solid var(--accent); transform: translate(-50%,-50%);
    box-shadow: 0 0 14px var(--accent);
    animation: pulse-ring 1.1s ease-in-out infinite;
  }
  @keyframes pulse-ring { 0%,100% { opacity: 0.9; transform: translate(-50%,-50%) scale(0.95);} 50% { opacity: 0.4; transform: translate(-50%,-50%) scale(1.08);} }
  .targetable-ring {
    position: absolute; width: 70px; height: 70px; border-radius: 50%;
    border: 2px dashed var(--enemy); transform: translate(-50%,-50%);
    pointer-events: auto; cursor: pointer;
  }

  /* Floating combat text */
  .float-text {
    position: absolute; font-weight: 800; font-size: 15px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.85);
    pointer-events: none; white-space: nowrap;
    animation: float-up 1.1s ease-out forwards;
  }
  @keyframes float-up {
    0% { transform: translate(-50%, 0) scale(0.7); opacity: 0; }
    15% { transform: translate(-50%, -8px) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%, -60px) scale(1); opacity: 0; }
  }
  .float-text.dmg { color: #ff8a8a; }
  .float-text.heal { color: #7dffb0; }
  .float-text.shield { color: #ffe27a; }
  .float-text.crit { color: #ff5252; font-size: 20px; }

  /* Speech bubbles (e.g. O Porteiro's "Bom dia") */
  .speech-bubble {
    position: absolute; transform: translate(-50%, -100%);
    background: #fff; color: #1a1a1a; font-weight: 800; font-size: 13px;
    padding: 6px 12px; border-radius: 14px; border: 2px solid #1a1a1a;
    white-space: nowrap; pointer-events: none;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    animation: bubble-pop 1.6s ease-out forwards;
  }
  .speech-bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -8px;
    transform: translateX(-50%); border-width: 8px 6px 0 6px;
    border-style: solid; border-color: #1a1a1a transparent transparent transparent;
  }
  .speech-bubble.shout {
    font-size: 18px; padding: 8px 16px; border-color: #b02a2a;
    color: #b02a2a; letter-spacing: 0.5px;
  }
  .speech-bubble.shout::after { border-color: #b02a2a transparent transparent transparent; }
  @keyframes bubble-pop {
    0% { transform: translate(-50%, -85%) scale(0.5); opacity: 0; }
    15% { transform: translate(-50%, -100%) scale(1.08); opacity: 1; }
    80% { transform: translate(-50%, -100%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -110%) scale(0.95); opacity: 0; }
  }

  /* Top bar */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 6;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: max(8px, env(safe-area-inset-top)) 10px 0 10px;
    pointer-events: none;
  }
  #turn-indicator {
    pointer-events: auto;
    background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 6px 12px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.4px;
  }
  #turn-indicator.player-turn { color: var(--player); }

  /* Approval Rating bar (CAMPAIGN_DESIGN.md §6.2) — conditionally shown
     by js/campaign/dario-shadow-boss.js only while the Shadow boss fight
     is active. Absolutely positioned within #topbar so it doesn't
     disturb the existing turn-indicator/log-toggle flex layout. */
  #approval-bar-wrap {
    display: none;
    position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    width: min(220px, 46vw);
    pointer-events: none;
  }
  #approval-bar-wrap.show { display: block; }
  #approval-bar-label {
    text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
    color: #d9c7ff; margin-bottom: 3px; text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  #approval-bar-bg {
    height: 8px; border-radius: 5px; overflow: hidden;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15);
  }
  #approval-bar-fill {
    height: 100%; width: 50%;
    background: linear-gradient(90deg, #ff5a6e, #d9c7ff, #7dffb0);
    transition: width 0.3s ease;
  }
  #approval-bar-wrap.approval-low #approval-bar-label { color: #ff8a8a; }
  #approval-bar-wrap.approval-high #approval-bar-label { color: #7dffb0; }
  #turn-indicator.enemy-turn { color: var(--enemy); }
  #log-toggle {
    pointer-events: auto;
    background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 6px 10px; font-size: 11px; color: #cfe8ff;
  }

  /* Auto-resolving banner shown between rounds when a hand card is forced
     onto an empty battlefield slot (death → forced replacement — see
     handoff.md's deck/hand/battlefield plan). No click needed; it fades
     itself out after a short delay (see showReinforcementBanner in
     index.html's inline script). */
  #reinforcement-banner {
    position: absolute; top: 54px; left: 50%; transform: translateX(-50%) translateY(-6px);
    pointer-events: none; z-index: 20;
    background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 10px; padding: 8px 16px; font-size: 13px; font-weight: 700;
    color: #e8eefc; white-space: nowrap;
    opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #reinforcement-banner.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Combat log */
  #log-panel {
    position: absolute; top: 42px; right: 10px; z-index: 6;
    width: min(240px, 60vw); max-height: 34vh; overflow-y: auto;
    background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 8px 10px; font-size: 11px; line-height: 1.5;
    display: none;
  }
  #log-panel.open { display: block; }
  #log-panel div { color: #b9c8e6; margin-bottom: 2px; }
  #log-panel div.hit { color: #ffb4b4; }
  #log-panel div.heal { color: #9dffc6; }
  #log-panel div.info { color: #8fd3ff; }

  /* Target preview panel: appears below the log button once an ability
     is selected, showing every currently-valid target with a portrait
     swatch, name, and HP bar — a lightweight reflection of the same
     targetable-ring pool used for in-scene click targeting. */
  #target-preview-panel {
    position: absolute; top: 42px; right: 10px; z-index: 6;
    display: none; flex-direction: column; gap: 5px;
    width: min(168px, 46vw);
  }
  #target-preview-panel.show { display: flex; }
  #target-preview-panel.below-log { top: 168px; } /* pushed down when the log panel is open */
  .target-preview-card {
    display: flex; align-items: center; gap: 7px;
    background: var(--panel-bg); border: 1.5px solid rgba(255,255,255,0.14);
    border-radius: 10px; padding: 5px 8px; cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    -webkit-user-select: none; user-select: none;
  }
  .target-preview-card:hover, .target-preview-card:active { border-color: var(--accent); background: rgba(110,231,255,0.1); }
  .target-preview-card .tp-portrait {
    width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto;
    border: 1.5px solid rgba(255,255,255,0.25);
  }
  .target-preview-card .tp-info { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .target-preview-card .tp-name {
    font-size: 10px; font-weight: 700; color: #eaf2ff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .target-preview-card .tp-hpwrap { width: 100%; height: 4px; background: rgba(0,0,0,0.5); border-radius: 3px; overflow: hidden; }
  .target-preview-card .tp-hpfill { height: 100%; background: linear-gradient(90deg,#2dd4bf,#4fd1c5); transition: width 0.3s; }
  .target-preview-card.enemy .tp-hpfill { background: linear-gradient(90deg,#ff6b6b,#ff9d4f); }
  .target-preview-card .tp-hptext { font-size: 8px; color: #9fb6d9; }

  #order-strip {
    position: absolute; top: 42px; left: 10px; z-index: 6;
    display: none; gap: 4px; background: var(--panel-bg);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
    padding: 6px 8px; max-width: 70vw; overflow-x: auto;
  }
  #order-strip.show { display: flex; }
  .order-chip {
    flex: 0 0 auto; font-size: 9px; font-weight: 700; padding: 3px 7px;
    border-radius: 6px; background: rgba(255,255,255,0.08); color: #cfe8ff;
    white-space: nowrap; opacity: 0.5;
  }
  .order-chip.player { border: 1px solid var(--player); }
  .order-chip.enemy { border: 1px solid var(--enemy); }
  .order-chip.active { opacity: 1; transform: scale(1.08); box-shadow: 0 0 8px rgba(255,255,255,0.3); }
  .order-chip.done { opacity: 0.25; text-decoration: line-through; }

  /* Bottom control panel */
  #controls {
    position: relative; z-index: 6; flex: 0 0 auto;
    background: var(--panel-bg); border-top: 1px solid rgba(255,255,255,0.1);
    padding: 8px 10px max(8px, env(safe-area-inset-bottom)) 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  #party-row {
    display: flex; gap: 6px; justify-content: space-between;
  }
  .party-card {
    flex: 1 1 0; min-width: 0;
    background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 6px 4px; text-align: center;
    display: flex; flex-direction: column; gap: 3px; align-items: center;
    transition: border-color 0.15s, background 0.15s; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  .party-card.selected { border-color: var(--accent); background: rgba(110,231,255,0.1); }
  .party-card.dead { opacity: 0.4; cursor: default; }
  .party-card .pc-name { font-size: 10px; font-weight: 700; }
  .party-card .pc-hpwrap { width: 100%; height: 5px; background: rgba(0,0,0,0.5); border-radius: 3px; overflow: hidden; }
  .party-card .pc-hpfill { height: 100%; background: linear-gradient(90deg,#2dd4bf,#4fd1c5); transition: width 0.3s; }
  .party-card .pc-hptext { font-size: 8px; color: #9fb6d9; }

  #ability-row {
    display: flex; gap: 6px;
    min-height: 54px;
  }
  .ability-btn {
    flex: 1 1 0; min-width: 0;
    background: linear-gradient(180deg, rgba(110,231,255,0.16), rgba(110,231,255,0.05));
    border: 1.5px solid rgba(110,231,255,0.4); border-radius: 10px;
    padding: 6px 4px; color: #eafcff; font-size: 11px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    -webkit-user-select: none; user-select: none;
  }
  .ability-btn .ab-desc { font-size: 8.5px; font-weight: 500; color: #b7d9e0; }
  .ability-btn .ab-speed { font-size: 8.5px; font-weight: 600; color: #ffe27a; }
  .ability-btn.queued { border-color: #7dffb0; background: linear-gradient(180deg, rgba(125,255,176,0.2), rgba(125,255,176,0.05)); }
  .ability-btn.locked-in { opacity: 0.5; }
  .ability-btn:active { transform: scale(0.96); }
  .ability-btn.disabled { opacity: 0.35; filter: grayscale(0.5); }
  .ability-btn.empty { visibility: hidden; }
  .ability-btn.passive { opacity: 0.75; filter: none; border-color: #8fd9c9; background: linear-gradient(180deg, rgba(143,217,201,0.12), rgba(143,217,201,0.03)); cursor: default; }
  .ability-btn.passive .ab-speed { color: #8fd9c9; }

  #status-line {
    font-size: 11px; color: #a8c1e6; text-align: center; min-height: 14px;
  }

  /* Overlay for victory/defeat */
  #overlay {
    position: absolute; inset: 0; z-index: 20;
    background: rgba(3,4,8,0.86);
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    text-align: center; padding: 20px;
  }
  #overlay.show { display: flex; }
  #overlay h1 { font-size: 28px; margin: 0; letter-spacing: 1px; }
  #overlay h1.win { color: #7dffb0; text-shadow: 0 0 20px rgba(125,255,176,0.5); }
  #overlay h1.lose { color: #ff8a8a; text-shadow: 0 0 20px rgba(255,138,138,0.5); }
  #restart-btn {
    background: var(--accent); color: #05121a; border: none; border-radius: 10px;
    padding: 12px 28px; font-size: 15px; font-weight: 800; cursor: pointer;
  }
  #restart-btn:active { transform: scale(0.96); }

  #loading {
    position: absolute; inset: 0; z-index: 30; background: #05060a;
    display: flex; align-items: center; justify-content: center;
    color: #6ee7ff; font-size: 13px; letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-wrap">
    <div id="loading">Loading battlefield…</div>
    <div id="label-layer"></div>
    <div id="topbar">
      <div id="turn-indicator" class="player-turn">YOUR TURN</div>
      <div id="approval-bar-wrap">
        <div id="approval-bar-label">Approval: 50</div>

      </div>
      <div id="log-toggle">Log ▾</div>
    </div>
    <div id="log-panel"></div>
    <div id="target-preview-panel"></div>
    <div id="order-strip"></div>
    <div id="reinforcement-banner"></div>
  </div>
  <div id="controls">
    <div id="status-line">Select one of your units</div>
    <div id="party-row"></div>
    <div id="ability-row"></div>
  </div>
  <div id="team-select-mount"></div>
  <div id="starter-select-mount"></div>
  <div id="main-menu-mount"></div>
  <div id="campaign-map-mount"></div>
  <div id="campaign-node-mount"></div>
  <div id="pvp-status-badge"></div>
  <div id="overlay">
    <h1 id="overlay-title">VICTORY</h1>
    <div id="overlay-sub" style="color:#b9c8e6;font-size:13px;"></div>
    <button id="restart-btn">Restart Battle</button>
  </div>
</div>
