<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Babawibby: 3v3 Battle Engine Demo</title>
<style>
  :root {
    --panel-bg: rgba(10,12,20,0.92);
    --accent: #6ee7ff;
    --player: #4fd1c5;
    --enemy: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05060a; color: #e8eefc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #canvas-wrap { position: relative; flex: 1 1 auto; min-height: 0; }
  #canvas-wrap canvas { display: block; width: 100%; height: 100%; }

  /* Floating name/HP labels over units */
  #label-layer { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .unit-label {
    position: absolute; transform: translate(-50%, -100%);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-width: 64px; pointer-events: none; transition: opacity 0.2s;
  }
  .unit-label .name {
    font-size: 10px; font-weight: 700; letter-spacing: 0.3px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    color: #fff;
  }
  .unit-label.dead .name { opacity: 0.35; text-decoration: line-through; }
  .hp-bar-bg {
    width: 60px; height: 7px; border-radius: 4px;
    background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.25);
    overflow: hidden;
  }
  .hp-bar-fill { height: 100%; border-radius: 3px; transition: width 0.35s ease; }
  .hp-bar-fill.player { background: linear-gradient(90deg,#2dd4bf,#4fd1c5); }
  .hp-bar-fill.enemy { background: linear-gradient(90deg,#f87171,#ff6b6b); }
  .hp-text { font-size: 9px; color: #cfe8ff; text-shadow: 0 1px 2px rgba(0,0,0,0.9); }
  .shield-pip {
    font-size: 9px; color: #ffe27a; text-shadow: 0 1px 2px rgba(0,0,0,0.9);
  }
  .status-row {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 3px;
    max-width: 90px;
  }
  .status-pip {
    font-size: 8px; line-height: 1; padding: 2px 4px; border-radius: 8px;
    background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.25);
    color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.9); white-space: nowrap;
  }
  .status-pip.status-kind-bleed { border-color: rgba(255,107,107,0.7); color: #ffb0b0; }
  .status-pip.counter-pip { border-color: rgba(255,226,122,0.7); color: #ffe27a; }
  .selected-ring {
    position: absolute; width: 78px; height: 78px; border-radius: 50%;
    border: 2px solid var(--accent); transform: translate(-50%,-50%);
    box-shadow: 0 0 14px var(--accent);
    animation: pulse-ring 1.1s ease-in-out infinite;
  }
  @keyframes pulse-ring { 0%,100% { opacity: 0.9; transform: translate(-50%,-50%) scale(0.95);} 50% { opacity: 0.4; transform: translate(-50%,-50%) scale(1.08);} }
  .targetable-ring {
    position: absolute; width: 70px; height: 70px; border-radius: 50%;
    border: 2px dashed var(--enemy); transform: translate(-50%,-50%);
    pointer-events: auto; cursor: pointer;
  }

  /* Floating combat text */
  .float-text {
    position: absolute; font-weight: 800; font-size: 15px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.85);
    pointer-events: none; white-space: nowrap;
    animation: float-up 1.1s ease-out forwards;
  }
  @keyframes float-up {
    0% { transform: translate(-50%, 0) scale(0.7); opacity: 0; }
    15% { transform: translate(-50%, -8px) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%, -60px) scale(1); opacity: 0; }
  }
  .float-text.dmg { color: #ff8a8a; }
  .float-text.heal { color: #7dffb0; }
  .float-text.shield { color: #ffe27a; }
  .float-text.crit { color: #ff5252; font-size: 20px; }

  /* Top bar */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 6;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: max(8px, env(safe-area-inset-top)) 10px 0 10px;
    pointer-events: none;
  }
  #turn-indicator {
    pointer-events: auto;
    background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 6px 12px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.4px;
  }
  #turn-indicator.player-turn { color: var(--player); }
  #turn-indicator.enemy-turn { color: var(--enemy); }
  #log-toggle {
    pointer-events: auto;
    background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 6px 10px; font-size: 11px; color: #cfe8ff;
  }

  /* Combat log */
  #log-panel {
    position: absolute; top: 42px; right: 10px; z-index: 6;
    width: min(240px, 60vw); max-height: 34vh; overflow-y: auto;
    background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 8px 10px; font-size: 11px; line-height: 1.5;
    display: none;
  }
  #log-panel.open { display: block; }
  #log-panel div { color: #b9c8e6; margin-bottom: 2px; }
  #log-panel div.hit { color: #ffb4b4; }
  #log-panel div.heal { color: #9dffc6; }
  #log-panel div.info { color: #8fd3ff; }

  #order-strip {
    position: absolute; top: 42px; left: 10px; z-index: 6;
    display: none; gap: 4px; background: var(--panel-bg);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
    padding: 6px 8px; max-width: 70vw; overflow-x: auto;
  }
  #order-strip.show { display: flex; }
  .order-chip {
    flex: 0 0 auto; font-size: 9px; font-weight: 700; padding: 3px 7px;
    border-radius: 6px; background: rgba(255,255,255,0.08); color: #cfe8ff;
    white-space: nowrap; opacity: 0.5;
  }
  .order-chip.player { border: 1px solid var(--player); }
  .order-chip.enemy { border: 1px solid var(--enemy); }
  .order-chip.active { opacity: 1; transform: scale(1.08); box-shadow: 0 0 8px rgba(255,255,255,0.3); }
  .order-chip.done { opacity: 0.25; text-decoration: line-through; }

  /* Bottom control panel */
  #controls {
    position: relative; z-index: 6; flex: 0 0 auto;
    background: var(--panel-bg); border-top: 1px solid rgba(255,255,255,0.1);
    padding: 8px 10px max(8px, env(safe-area-inset-bottom)) 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  #party-row {
    display: flex; gap: 6px; justify-content: space-between;
  }
  .party-card {
    flex: 1 1 0; min-width: 0;
    background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 6px 4px; text-align: center;
    display: flex; flex-direction: column; gap: 3px; align-items: center;
    transition: border-color 0.15s, background 0.15s; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  .party-card.selected { border-color: var(--accent); background: rgba(110,231,255,0.1); }
  .party-card.dead { opacity: 0.4; cursor: default; }
  .party-card .pc-name { font-size: 10px; font-weight: 700; }
  .party-card .pc-hpwrap { width: 100%; height: 5px; background: rgba(0,0,0,0.5); border-radius: 3px; overflow: hidden; }
  .party-card .pc-hpfill { height: 100%; background: linear-gradient(90deg,#2dd4bf,#4fd1c5); transition: width 0.3s; }
  .party-card .pc-hptext { font-size: 8px; color: #9fb6d9; }

  #ability-row {
    display: flex; gap: 6px;
    min-height: 54px;
  }
  .ability-btn {
    flex: 1 1 0; min-width: 0;
    background: linear-gradient(180deg, rgba(110,231,255,0.16), rgba(110,231,255,0.05));
    border: 1.5px solid rgba(110,231,255,0.4); border-radius: 10px;
    padding: 6px 4px; color: #eafcff; font-size: 11px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    -webkit-user-select: none; user-select: none;
  }
  .ability-btn .ab-desc { font-size: 8.5px; font-weight: 500; color: #b7d9e0; }
  .ability-btn .ab-speed { font-size: 8.5px; font-weight: 600; color: #ffe27a; }
  .ability-btn.queued { border-color: #7dffb0; background: linear-gradient(180deg, rgba(125,255,176,0.2), rgba(125,255,176,0.05)); }
  .ability-btn.locked-in { opacity: 0.5; }
  .ability-btn:active { transform: scale(0.96); }
  .ability-btn.disabled { opacity: 0.35; filter: grayscale(0.5); }
  .ability-btn.empty { visibility: hidden; }

  #status-line {
    font-size: 11px; color: #a8c1e6; text-align: center; min-height: 14px;
  }

  /* Overlay for victory/defeat */
  #overlay {
    position: absolute; inset: 0; z-index: 20;
    background: rgba(3,4,8,0.86);
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    text-align: center; padding: 20px;
  }
  #overlay.show { display: flex; }
  #overlay h1 { font-size: 28px; margin: 0; letter-spacing: 1px; }
  #overlay h1.win { color: #7dffb0; text-shadow: 0 0 20px rgba(125,255,176,0.5); }
  #overlay h1.lose { color: #ff8a8a; text-shadow: 0 0 20px rgba(255,138,138,0.5); }
  #restart-btn {
    background: var(--accent); color: #05121a; border: none; border-radius: 10px;
    padding: 12px 28px; font-size: 15px; font-weight: 800; cursor: pointer;
  }
  #restart-btn:active { transform: scale(0.96); }

  #team-select {
    position: absolute; inset: 0; z-index: 25;
    background: rgba(3,4,8,0.94);
    display: none; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 24px 16px; overflow-y: auto; gap: 18px;
  }
  #team-select.show { display: flex; }
  #team-select h1 { font-size: 20px; margin: 4px 0 0; letter-spacing: 0.5px; color: #6ee7ff; }
  #team-select .ts-sub { color: #b9c8e6; font-size: 12px; margin-bottom: 4px; text-align: center; }
  .ts-role-group { width: 100%; max-width: 520px; }
  .ts-role-label { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #7fd8ff; margin: 0 0 8px 4px; }
  .ts-cards { display: flex; gap: 10px; flex-wrap: wrap; }
  .ts-card {
    flex: 1 1 140px; min-width: 130px; background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 12px;
    cursor: pointer; text-align: left; transition: border-color 0.15s, background 0.15s;
  }
  .ts-card:active { transform: scale(0.98); }
  .ts-card.selected { border-color: #7dffb0; background: rgba(125,255,176,0.1); }
  .ts-card .ts-name { font-weight: 800; font-size: 13px; margin-bottom: 4px; }
  .ts-card .ts-hp { font-size: 11px; color: #b9c8e6; }
  #team-select-confirm {
    background: var(--accent); color: #05121a; border: none; border-radius: 10px;
    padding: 12px 32px; font-size: 15px; font-weight: 800; cursor: pointer;
    margin-top: 6px; opacity: 0.4; pointer-events: none;
  }
  #team-select-confirm.ready { opacity: 1; pointer-events: auto; }

  #loading {
    position: absolute; inset: 0; z-index: 30; background: #05060a;
    display: flex; align-items: center; justify-content: center;
    color: #6ee7ff; font-size: 13px; letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-wrap">
    <div id="loading">Loading battlefield…</div>
    <div id="label-layer"></div>
    <div id="topbar">
      <div id="turn-indicator" class="player-turn">YOUR TURN</div>
      <div id="log-toggle">Log ▾</div>
    </div>
    <div id="log-panel"></div>
    <div id="order-strip"></div>
  </div>
  <div id="controls">
    <div id="status-line">Select one of your units</div>
    <div id="party-row"></div>
    <div id="ability-row"></div>
  </div>
  <div id="team-select">
    <h1>CHOOSE YOUR TEAM</h1>
    <div class="ts-sub">Pick one card for each role: Defender, Attacker, Support</div>
    <div id="team-select-groups"></div>
    <button id="team-select-confirm">Start Battle</button>
  </div>
  <div id="overlay">
    <h1 id="overlay-title">VICTORY</h1>
    <div id="overlay-sub" style="color:#b9c8e6;font-size:13px;"></div>
    <button id="restart-btn">Restart Battle</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/effects.js"></script>
<script src="js/units.js"></script>
<script src="js/combat-engine.js"></script>
<script>
// =============================================================
// ============ SECTION 1: DATA-DRIVEN UNIT DEFINITIONS ========
// =============================================================
// Combat engine only reads .stats and .abilities.
// Animation engine only reads .animKey per ability + unit.animations.
// Neither engine hard-codes the other's concerns.

// UNIT_DEFS / PLAYER_ORDER / ENEMY_ORDER now loaded from js/units.js

// Abilities no longer carry a single .type since they can mix multiple
// effect verbs (e.g. Ajax's Duelo is damage+damage, Mariana's Golpe de Luz
// is damage+gainCounter). This derives a primary "flavor" for anything that
// still needs one bucket to reason about: animation choreography choice
// and the simple AI's heuristics.
function primaryEffectType(ability) {
  const verbs = ability.effects.map(e => e.verb);
  if (verbs.includes('heal')) return 'heal';
  if (verbs.includes('shield')) return 'shield';
  if (verbs.includes('damage')) return 'attack';
  return verbs[0] || 'attack';
}

// =============================================================
// ============ SECTION 2: THREE.JS SCENE SETUP ================
// =============================================================

const canvasWrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060a, 0.028);

const camera = new THREE.PerspectiveCamera(45, canvasWrap.clientWidth / canvasWrap.clientHeight, 0.1, 100);
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 700;
const CAMERA_LOOK_AT = new THREE.Vector3(0, 1, 0);
camera.position.set(0, isMobile ? 9.5 : 8, isMobile ? 14.5 : 12);
camera.lookAt(CAMERA_LOOK_AT);

const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 2 : 2));
renderer.setSize(canvasWrap.clientWidth, canvasWrap.clientHeight);
renderer.shadowMap.enabled = !isMobile; // skip shadows on mobile for perf
if (renderer.shadowMap.enabled) renderer.shadowMap.type = THREE.PCFSoftShadowMap;
canvasWrap.appendChild(renderer.domElement);

// Ground
const groundGeo = new THREE.CircleGeometry(16, 48);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x0c1018, roughness: 0.9, metalness: 0.1 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Center divide glow ring
const ringGeo = new THREE.RingGeometry(3.6, 3.75, 48);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x1a3a4a, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
const centerRing = new THREE.Mesh(ringGeo, ringMat);
centerRing.rotation.x = -Math.PI / 2;
centerRing.position.y = 0.02;
scene.add(centerRing);

// Grid lines
const grid = new THREE.GridHelper(20, 20, 0x1c2740, 0x121826);
grid.position.y = 0.01;
scene.add(grid);

// Lighting
const ambient = new THREE.AmbientLight(0x445566, 0.55);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
keyLight.position.set(4, 10, 6);
keyLight.castShadow = renderer.shadowMap.enabled;
if (keyLight.castShadow) {
  keyLight.shadow.mapSize.set(1024, 1024);
  keyLight.shadow.camera.left = -10; keyLight.shadow.camera.right = 10;
  keyLight.shadow.camera.top = 10; keyLight.shadow.camera.bottom = -10;
}
scene.add(keyLight);

// Team-colored rim lights
const playerLight = new THREE.PointLight(0x4fd1c5, 1.1, 14);
playerLight.position.set(0, 3, 6);
scene.add(playerLight);

const enemyLight = new THREE.PointLight(0xff6b6b, 1.1, 14);
enemyLight.position.set(0, 3, -6);
scene.add(enemyLight);

function onResize() {
  const w = canvasWrap.clientWidth, h = canvasWrap.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

// =============================================================
// ============ SECTION 3: ANIMATION PRIMITIVES =================
// =============================================================
// Generalized from the Babawibby Turret MVP's timeline/easing/
// particle system. These primitives know nothing about "damage"
// or "healing" — only about moving/scaling/spawning things.

const Easing = {
  linear: t => t,
  quadOut: t => 1 - (1 - t) * (1 - t),
  quadIn: t => t * t,
  cubicOut: t => 1 - Math.pow(1 - t, 3),
  cubicIn: t => t * t * t,
  backOut: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  elasticOut: t => {
    const c4 = (2 * Math.PI) / 3;
    return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
  sineInOut: t => -(Math.cos(Math.PI * t) - 1) / 2
};

// A single running "clip": duration, update(progress), optional onComplete.
class Clip {
  constructor(duration, update, onComplete) {
    this.duration = Math.max(duration, 0.0001);
    this.update = update;
    this.onComplete = onComplete;
    this.elapsed = 0;
    this.done = false;
  }
  tick(dt) {
    if (this.done) return;
    this.elapsed += dt;
    const t = Math.min(this.elapsed / this.duration, 1);
    this.update(t);
    if (t >= 1) {
      this.done = true;
      if (this.onComplete) this.onComplete();
    }
  }
}

// The AnimationRunner plays a queue of steps. Each step is either:
//  - a Clip-producing function -> runs and waits for completion (sequence)
//  - an array of step-defs -> runs all in parallel, waits for all (parallel)
//  - a plain function -> runs synchronously (instant callback / event marker)
//  - {wait: seconds} -> pause
// This mirrors the Babawibby MVP's "timeline -> event -> effect -> next event" chain.
class AnimationRunner {
  constructor() {
    this.activeClips = [];
  }

  tick(dt) {
    for (let i = this.activeClips.length - 1; i >= 0; i--) {
      this.activeClips[i].tick(dt);
      if (this.activeClips[i].done) this.activeClips.splice(i, 1);
    }
  }

  // Runs a list of step definitions in strict sequence, returns a Promise.
  async playSequence(steps) {
    for (const step of steps) {
      await this._runStep(step);
    }
  }

  async _runStep(step) {
    if (!step) return;
    if (typeof step === 'function') {
      // Instant callback / event marker (e.g. "GAMEPLAY DAMAGE EVENT")
      return step();
    }
    if (step.wait !== undefined) {
      return this._runClip(new Clip(step.wait, () => {}));
    }
    if (Array.isArray(step)) {
      // Parallel group
      return Promise.all(step.map(s => this._runStep(s)));
    }
    if (step.clip) {
      return this._runClip(step.clip);
    }
  }

  _runClip(clip) {
    return new Promise(resolve => {
      const originalOnComplete = clip.onComplete;
      clip.onComplete = () => { if (originalOnComplete) originalOnComplete(); resolve(); };
      this.activeClips.push(clip);
    });
  }
}

const animRunner = new AnimationRunner();

// --- Reusable primitive builders -------------------------------
// Each returns a "step" consumable by playSequence.

function moveTo(obj3d, toVec3, duration, easeFn = Easing.cubicOut) {
  return {
    clip: new Clip(duration, t => {
      const e = easeFn(t);
      obj3d.position.lerpVectors(obj3d.userData._moveFrom, toVec3, e);
    }, () => {})
  };
  // Note: caller must set obj3d.userData._moveFrom = obj3d.position.clone() before invoking.
}

function makeMove(obj3d, toVec3, duration, easeFn = Easing.cubicOut) {
  return () => {
    obj3d.userData._moveFrom = obj3d.position.clone();
    return moveTo(obj3d, toVec3, duration, easeFn);
  };
}

// Simpler helper: directly build a move step capturing "from" at call time.
function moveStep(obj3d, toVec3, duration, easeFn = Easing.cubicOut) {
  return {
    clip: (() => {
      const from = obj3d.position.clone();
      return new Clip(duration, t => {
        const e = easeFn(t);
        obj3d.position.lerpVectors(from, toVec3, e);
      });
    })()
  };
}

function scaleStep(obj3d, toScale, duration, easeFn = Easing.quadOut) {
  return {
    clip: (() => {
      const from = obj3d.scale.clone();
      const to = new THREE.Vector3(toScale, toScale, toScale);
      return new Clip(duration, t => {
        const e = easeFn(t);
        obj3d.scale.lerpVectors(from, to, e);
      });
    })()
  };
}

function squashStretchStep(obj3d, sx, sy, sz, duration, easeFn = Easing.backOut) {
  return {
    clip: (() => {
      const from = obj3d.scale.clone();
      const to = new THREE.Vector3(sx, sy, sz);
      return new Clip(duration, t => {
        const e = easeFn(t);
        obj3d.scale.lerpVectors(from, to, e);
      });
    })()
  };
}

function rotateStep(obj3d, toY, duration, easeFn = Easing.quadOut) {
  return {
    clip: (() => {
      const from = obj3d.rotation.y;
      return new Clip(duration, t => {
        const e = easeFn(t);
        obj3d.rotation.y = from + (toY - from) * e;
      });
    })()
  };
}

function waitStep(seconds) {
  return { wait: seconds };
}

function callbackStep(fn) {
  return fn;
}

// ---- Toon shading helper (from babawibby_zoom_v3.html reference) -----
// A 3-stop gradient map read by MeshToonMaterial to band the lighting into
// flat shade/mid/highlight steps instead of Standard's smooth PBR falloff.
// One shared gradient texture for every character (cheap, consistent look).
// Declared here (before MoveLibrary) since MoveLibrary's impact-plugin
// moves (boxingGlove/biteJaw) build MeshToonMaterial instances that need it.
function makeToonGradient(stops) {
  const canvas = document.createElement('canvas');
  canvas.width = stops.length; canvas.height = 1;
  const ctx = canvas.getContext('2d');
  stops.forEach((v, i) => { ctx.fillStyle = `rgb(${v},${v},${v})`; ctx.fillRect(i, 0, 1, 1); });
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.NearestFilter; tex.magFilter = THREE.NearestFilter;
  return tex;
}
const TOON_GRADIENT = makeToonGradient([70, 170, 255]);

// =============================================================
// ============ MOVE LIBRARY (generic, reusable per-move flourishes) ====
// =============================================================
// Layer above the raw step builders above. Every function here is a
// generic, parametrized animation move with NO character-specific logic —
// character personality comes from which moves a CHARACTER_ANIM_PROFILE
// picks and what parameters it passes, not from anything hardcoded here.
// Each function returns a "step" (or array of steps) consumable by
// animRunner.playSequence, same contract as moveStep/scaleStep/etc.

const MoveLibrary = {
  // Pop an object from scale 0 to a target scale with a springy overshoot.
  // Good for spawn-ins / sudden appearances (e.g. Babawibby popping into frame).
  popIn(obj3d, { scale = 1, duration = 0.32, easing = Easing.backOut } = {}) {
    return {
      clip: (() => {
        obj3d.scale.set(0, 0, 0);
        const to = new THREE.Vector3(scale, scale, scale);
        return new Clip(duration, t => {
          const e = easing(t);
          obj3d.scale.set(to.x * e, to.y * e, to.z * e);
        });
      })()
    };
  },

  // Cartoon squash & stretch toward (sx,sy,sz) and back to (1,1,1).
  // intensity scales how far from 1 the squash/stretch axes are pushed.
  squashStretch(obj3d, { intensity = 1, duration = 0.22, axis = 'y', easingOut = Easing.quadOut, easingBack = Easing.backOut } = {}) {
    const stretch = 1 + 0.22 * intensity;
    const squash = 1 - 0.22 * intensity;
    const sx = axis === 'x' ? stretch : squash;
    const sy = axis === 'y' ? stretch : squash;
    const sz = axis === 'z' ? stretch : squash;
    return [
      squashStretchStep(obj3d, sx, sy, sz, duration * 0.4, easingOut),
      squashStretchStep(obj3d, 1, 1, 1, duration * 0.6, easingBack)
    ];
  },

  // A quick vertical hop in place — pop up then land, with squash on landing.
  bounceHop(obj3d, { height = 0.25, duration = 0.3, squashOnLand = true } = {}) {
    const homeY = obj3d.position.y;
    const steps = [
      {
        clip: (() => {
          const fromY = obj3d.position.y;
          return new Clip(duration * 0.45, t => {
            obj3d.position.y = fromY + Math.sin(Easing.quadOut(t) * Math.PI * 0.5) * height;
          });
        })()
      },
      {
        clip: (() => {
          const fromY = obj3d.position.y;
          return new Clip(duration * 0.55, t => {
            const e = Easing.cubicIn(t);
            obj3d.position.y = fromY + (homeY - fromY) * e;
          }, () => { obj3d.position.y = homeY; });
        })()
      }
    ];
    if (squashOnLand) steps.push(squashStretchStep(obj3d, 1.15, 0.82, 1.15, 0.1, Easing.quadOut), squashStretchStep(obj3d, 1, 1, 1, 0.16, Easing.backOut));
    return steps;
  },

  // Oscillating tilt/rocking on one axis — good for a mischievous idle
  // flourish or a "settling" wobble after landing.
  wobble(obj3d, { axis = 'z', amount = 0.12, speed = 8, cycles = 2, duration = 0.5 } = {}) {
    return {
      clip: (() => {
        const from = obj3d.rotation[axis];
        return new Clip(duration, t => {
          const decay = 1 - t;
          obj3d.rotation[axis] = from + Math.sin(t * speed * cycles) * amount * decay;
        }, () => { obj3d.rotation[axis] = from; });
      })()
    };
  },

  // Fading/pulsing ground-contact shadow blob under a landing/spawning unit.
  // Expects a mesh (e.g. unit.groundShadow) with a material that has .opacity.
  groundShadowPulse(shadowMesh, { peakOpacity = 0.5, duration = 0.3 } = {}) {
    if (!shadowMesh) return callbackStep(() => {});
    return {
      clip: (() => {
        shadowMesh.material.transparent = true;
        return new Clip(duration, t => {
          const e = Math.sin(Math.min(1, t) * Math.PI);
          shadowMesh.material.opacity = peakOpacity * e;
        });
      })()
    };
  },

  // ---- Impact-moment "plug-in" visuals — fire at the frame gameplay lands ----
  // Reusable across any character/ability whose flavor matches; not tied to
  // whoever first needed them (Ajax uses both, but neither is Ajax-specific).

  // Generic fighting-type impact: a boxing-glove shape appears at the hit
  // point and the hit lands on the same beat.
  boxingGlove(hitPoint, { color = 0xdd3333, size = 0.32 } = {}) {
    return callbackStep(() => {
      const glove = new THREE.Group();
      const fist = new THREE.Mesh(new THREE.SphereGeometry(size * 0.5, 10, 8), new THREE.MeshToonMaterial({ color, gradientMap: TOON_GRADIENT }));
      fist.scale.set(1, 0.85, 1);
      glove.add(fist);
      const cuff = new THREE.Mesh(new THREE.CylinderGeometry(size * 0.28, size * 0.32, size * 0.35, 8), new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap: TOON_GRADIENT }));
      cuff.position.y = -size * 0.4;
      glove.add(cuff);
      glove.position.copy(hitPoint);
      glove.scale.set(0.3, 0.3, 0.3);
      scene.add(glove);
      const start = performance.now();
      const anim = new Clip(0.22, t => {
        const e = Easing.backOut(Math.min(1, t / 0.5));
        const s = Math.min(1, t / 0.5) < 1 ? e : (1 - Easing.quadIn((t - 0.5) / 0.5));
        glove.scale.set(s, s, s);
      }, () => { scene.remove(glove); glove.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); });
      animRunner.activeClips.push(anim);
    });
  },

  // Generic monster-bite impact: two jaw shapes spawn over the target, snap
  // shut on the impact frame, then despawn.
  biteJaw(hitPoint, { color = 0xffffff, size = 0.3 } = {}) {
    return callbackStep(() => {
      const jawMat = new THREE.MeshToonMaterial({ color, gradientMap: TOON_GRADIENT });
      const upper = new THREE.Mesh(new THREE.ConeGeometry(size * 0.55, size * 0.5, 6), jawMat);
      const lower = new THREE.Mesh(new THREE.ConeGeometry(size * 0.55, size * 0.5, 6), jawMat.clone());
      upper.position.copy(hitPoint).add(new THREE.Vector3(0, size * 0.35, 0));
      lower.position.copy(hitPoint).add(new THREE.Vector3(0, -size * 0.35, 0));
      upper.rotation.x = Math.PI;
      scene.add(upper); scene.add(lower);
      const clip = new Clip(0.2, t => {
        const close = Easing.cubicIn(Math.min(1, t / 0.6));
        const openAmt = (1 - close) * size * 0.4;
        upper.position.y = hitPoint.y + size * 0.35 + openAmt - close * size * 0.1;
        lower.position.y = hitPoint.y - size * 0.35 - openAmt + close * size * 0.1;
        if (t > 0.6) {
          const fade = 1 - (t - 0.6) / 0.4;
          upper.scale.set(fade, fade, fade);
          lower.scale.set(fade, fade, fade);
        }
      }, () => {
        scene.remove(upper); scene.remove(lower);
        upper.geometry.dispose(); lower.geometry.dispose(); jawMat.dispose();
      });
      animRunner.activeClips.push(clip);
    });
  }
};

// =============================================================
// ============ CHARACTER ANIMATION PROFILES ====================
// =============================================================
// Per-character table of which MoveLibrary flourishes to layer at which
// choreography moment, with per-character parameters. A character with no
// entry here (or no entry for a given moment) just gets the existing
// generic behavior untouched — this is additive, not a replacement path.
//
// Moments used below:
//   spawn        — one-shot, called when a unit's model first appears
//   attackImpact(abilityId) — plug-in visual fired at the impact frame of
//                  runAttackAnimation, keyed by ability id so different
//                  skills on the same character can pick different moves
//   windup       — extra flourish layered onto the existing wind-up step
//   idle         — extra per-frame flourish layered onto updateIdle

const CHARACTER_ANIM_PROFILES = {
  // Comedic tone: bouncy, springy, "cute" easing throughout.
  babawibby: {
    spawn(unit) {
      return [
        MoveLibrary.popIn(unit.body, { scale: 1, duration: 0.36, easing: Easing.backOut }),
        ...MoveLibrary.bounceHop(unit.body, { height: 0.18, duration: 0.26 })
      ];
    },
    windup(unit) {
      return MoveLibrary.wobble(unit.body, { axis: 'z', amount: 0.1, speed: 10, duration: 0.3 });
    },
    idleExtra(unit, t) {
      // slightly more pronounced bob/sway than the generic idle, comedic wobble
      unit.body.rotation.z = Math.sin(t * 1.7) * 0.05;
    }
  },

  // Strong/impetuous tone: heavier squash/stretch, sharper cubicOut easing,
  // forceful wind-up/lunge, deliberately less bouncy/cute than Babawibby.
  ajax: {
    windup(unit) {
      return MoveLibrary.squashStretch(unit.body, { intensity: 1.4, duration: 0.24, axis: 'y', easingOut: Easing.cubicOut, easingBack: Easing.cubicOut });
    },
    // Keyed by ability id — see handoff.md's confirmed per-ability mapping.
    attackImpact(unit, target, abilityId) {
      if (abilityId === 'duel') {
        // skill1 "Duelo" — generic fighting-type impact
        return MoveLibrary.boxingGlove(target.hitPoint, { color: 0x3a5a7a, size: 0.34 });
      }
      if (abilityId === 'bleedstrike') {
        // skill2 "Golpe Sangrento" — generic monster-bite impact, jaw shapes
        // are separate meshes positioned at the target, not Ajax's own head
        return MoveLibrary.biteJaw(target.hitPoint, { color: 0xeaeaea, size: 0.3 });
      }
      return null; // chainstrike/skill3 keeps the existing dash-based visual as-is
    }
  }
};


let shakeState = { time: 0, duration: 0, magnitude: 0 };
function triggerCameraShake(magnitude = 0.18, duration = 0.25) {
  if (isMobile) magnitude *= 0.7; // gentler on mobile
  shakeState = { time: 0, duration, magnitude };
}
function updateCameraShake(dt) {
  if (shakeState.time < shakeState.duration) {
    shakeState.time += dt;
    const decay = 1 - (shakeState.time / shakeState.duration);
    const mag = shakeState.magnitude * decay;
    camera.position.x = camera.baseX + (Math.random() - 0.5) * mag;
    camera.position.y = camera.baseY + (Math.random() - 0.5) * mag;
  } else if (camera.baseX !== undefined) {
    camera.position.x = camera.baseX;
    camera.position.y = camera.baseY;
  }
}
camera.baseX = camera.position.x;
camera.baseY = camera.position.y;

// =============================================================
// ============ IDLE CAMERA ORBIT (planning phase "show off") ===
// =============================================================
// While waiting on the player's input (planning phase), slowly orbit
// the camera around the battlefield, Pokemon-battle-style, so the new
// per-card models get shown off from a few angles. Snaps back to the
// exact home framing the instant the round starts resolving.
//
// Implemented as spherical coordinates around CAMERA_LOOK_AT, computed
// from the camera's own home position/target so it stays correct if
// the home framing (isMobile branch above) ever changes. Camera shake
// (used during hit impacts, always in the 'resolving' phase) still
// works on top of this: updateCameraShake offsets from camera.baseX/Y,
// and camera.baseX/Y are refreshed to the orbit-computed position each
// frame while orbiting so the two systems don't fight each other.

const cameraHome = (() => {
  const offset = camera.position.clone().sub(CAMERA_LOOK_AT);
  const radius = Math.hypot(offset.x, offset.z);
  return {
    radius,
    height: camera.position.y,
    angle: Math.atan2(offset.z, offset.x) // home azimuth, radians
  };
})();

const ORBIT_SPEED = 0.16;      // radians/sec — slow, cinematic sweep
const ORBIT_SWING = 0.62;      // max radians of azimuth drift off home each direction
const ORBIT_HEIGHT_SWING = 0.55; // vertical bob while orbiting, in world units
const ORBIT_SNAP_SECONDS = 0.45; // how fast the camera eases back to home framing on battle start

let orbitEnabled = true;      // planning phase only; toggled by phase transitions below
let orbitTime = 0;
let orbitSnapping = false;    // true while easing back to home after battle start
let orbitSnapT = 0;
let orbitSnapFrom = null;     // { angle, height } captured at the moment snap-back begins

function setCameraOrbitEnabled(enabled) {
  if (enabled === orbitEnabled) return;
  orbitEnabled = enabled;
  if (!enabled) {
    // Capture current orbit framing and ease back to home instead of
    // teleporting, so the transition into battle reads as a deliberate
    // "snap into position" rather than a jarring pop.
    orbitSnapping = true;
    orbitSnapT = 0;
    orbitSnapFrom = { angle: currentOrbitAngle(), height: camera.position.y };
  } else {
    orbitSnapping = false;
    orbitTime = 0; // restart the sweep fresh each planning phase
  }
}

function currentOrbitAngle() {
  const offset = camera.position.clone().sub(CAMERA_LOOK_AT);
  return Math.atan2(offset.z, offset.x);
}

function setCameraFromPolar(angle, height) {
  camera.position.x = CAMERA_LOOK_AT.x + Math.cos(angle) * cameraHome.radius;
  camera.position.z = CAMERA_LOOK_AT.z + Math.sin(angle) * cameraHome.radius;
  camera.position.y = height;
  camera.lookAt(CAMERA_LOOK_AT);
  camera.baseX = camera.position.x;
  camera.baseY = camera.position.y;
}

function updateCameraOrbit(dt) {
  if (orbitSnapping) {
    orbitSnapT = Math.min(1, orbitSnapT + dt / ORBIT_SNAP_SECONDS);
    const e = 1 - Math.pow(1 - orbitSnapT, 3); // ease-out cubic
    const angle = orbitSnapFrom.angle + (cameraHome.angle - orbitSnapFrom.angle) * e;
    const height = orbitSnapFrom.height + (cameraHome.height - orbitSnapFrom.height) * e;
    setCameraFromPolar(angle, height);
    if (orbitSnapT >= 1) orbitSnapping = false;
    return;
  }

  if (!orbitEnabled) return;

  // Idle orbit sweep disabled — with a 4th (summon) slot now in play, the
  // fixed-radius sweep around CAMERA_LOOK_AT no longer frames the battlefield
  // well once a unit is summoned into the back slot. Hold the static home
  // framing during planning instead of sweeping.
  setCameraFromPolar(cameraHome.angle, cameraHome.height);
}

// =============================================================
// ============ SECTION 4: PARTICLE / EFFECT SYSTEM =============
// =============================================================
// Lightweight pooled particle bursts (generalized from Babawibby's
// dust/impact/speed-streak particles). Kept cheap for mobile GPUs.

const activeParticles = [];

function spawnBurst({ position, color = 0xffffff, count = 10, spread = 0.5, speed = 2.5, size = 0.06, life = 0.5, gravity = -4 }) {
  if (isMobile) count = Math.ceil(count * 0.6);
  const geo = new THREE.SphereGeometry(size, 5, 5);
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
  for (let i = 0; i < count; i++) {
    const mesh = new THREE.Mesh(geo, mat.clone());
    mesh.position.copy(position);
    scene.add(mesh);
    const angle = Math.random() * Math.PI * 2;
    const upBias = Math.random() * 0.6 + 0.2;
    const vel = new THREE.Vector3(
      Math.cos(angle) * spread * speed * Math.random(),
      upBias * speed,
      Math.sin(angle) * spread * speed * Math.random()
    );
    activeParticles.push({ mesh, vel, life, age: 0, gravity });
  }
}

function spawnImpactRing(position, color = 0xffffff, size = 0.9) {
  const geo = new THREE.RingGeometry(0.05, size, 20);
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.85, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(geo, mat);
  ring.position.copy(position);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.1;
  scene.add(ring);
  activeParticles.push({ mesh: ring, vel: new THREE.Vector3(0,0,0), life: 0.35, age: 0, gravity: 0, isRing: true, ringSize: size });
}

function spawnProjectileTrail(position, color) {
  const geo = new THREE.SphereGeometry(0.05, 4, 4);
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(position);
  scene.add(mesh);
  activeParticles.push({ mesh, vel: new THREE.Vector3(0,0,0), life: 0.3, age: 0, gravity: 0 });
}

function updateParticles(dt) {
  for (let i = activeParticles.length - 1; i >= 0; i--) {
    const p = activeParticles[i];
    p.age += dt;
    const t = p.age / p.life;
    if (t >= 1) {
      scene.remove(p.mesh);
      p.mesh.geometry.dispose(); p.mesh.material.dispose();
      activeParticles.splice(i, 1);
      continue;
    }
    if (p.isRing) {
      const s = 1 + t * 1.8;
      p.mesh.scale.set(s, s, s);
      p.mesh.material.opacity = 0.85 * (1 - t);
    } else {
      p.vel.y += p.gravity * dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      p.mesh.material.opacity = 1 - t;
      const sc = 1 - t * 0.5;
      p.mesh.scale.set(sc, sc, sc);
    }
  }
}

// =============================================================
// ============ SECTION 5: STYLIZED PRIMITIVE MODELS ============
// =============================================================
// Named model components, matching the Babawibby MVP pattern of
// building characters from labeled primitive parts so animations
// can target specific named pieces (e.g. "core", "weaponArm").

// ---- Bespoke per-card archetype builders -----------------------------
// Each takes (bodyGroup, mainMat, accentMat, def) and returns the outline
// candidates for that build (parts that should get the toon-outline
// backface pass). They add their own named parts directly to bodyGroup,
// including a "core" and (optionally) a "weapon" — those two names are
// read elsewhere (combat-engine pulse/bob animation, attack recoil), so
// any bespoke build should include a mesh named "core" at minimum.
// Keep these fully custom (not calling into the shared brute/caster
// helpers) — that's the point of a bespoke archetype. Register new ones
// in BESPOKE_BUILDERS below and set `shape: "<key>"` on the unit def.

// r128 has no THREE.CapsuleGeometry (added upstream in r142), so this
// helper builds a capsule-like shape from a cylinder + two sphere caps
// combined in a Group. A Group supports .position/.rotation/.scale/.name/
// .castShadow the same way a Mesh does, so it's a drop-in replacement
// anywhere the bespoke builders below want a rounded limb/torso.
function makeCapsule(radius, length, mat) {
  const group = new THREE.Group();
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 8), mat);
  cyl.castShadow = true;
  group.add(cyl);
  const capTop = new THREE.Mesh(new THREE.SphereGeometry(radius, 8, 6), mat);
  capTop.position.y = length / 2;
  capTop.castShadow = true;
  group.add(capTop);
  const capBottom = new THREE.Mesh(new THREE.SphereGeometry(radius, 8, 6), mat);
  capBottom.position.y = -length / 2;
  capBottom.castShadow = true;
  group.add(capBottom);
  group.castShadow = true;
  return group;
}

function buildAjaxModel(bodyGroup, mainMat, accentMat, def) {
  // Ajax, o Ultra-Humano — remodeled to match the card art: a musclebound
  // shark-man with a true FLAT/WIDE hammerhead cephalofoil (not a bulbous
  // stretched egg), defined shoulders/biceps built from separate masses,
  // and an upright fighting stance. Less "friendly toy", more "action figure".
  const darkMat = mainMat.clone();
  darkMat.color.multiplyScalar(0.6);

  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.44, 0.85, 10), mainMat);
  torso.scale.set(1.15, 1, 0.82);
  torso.position.y = 0.95;
  torso.castShadow = true;
  torso.name = "torso";
  bodyGroup.add(torso);

  // pale belly plate for shark-underside readability
  const bellyPlate = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.3, 0.7, 10), accentMat);
  bellyPlate.scale.set(0.9, 1, 0.5);
  bellyPlate.position.set(0, 0.92, 0.28);
  bellyPlate.name = "bellyPlate";
  bodyGroup.add(bellyPlate);

  // separate shoulder masses for a muscular (not rounded-toy) silhouette
  [-1, 1].forEach(side => {
    const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), mainMat);
    shoulder.position.set(side * 0.44, 1.32, 0);
    shoulder.name = "shoulder_" + (side < 0 ? "L" : "R");
    bodyGroup.add(shoulder);
  });

  // TRUE hammerhead: a flat wide cylinder bridge with rounded caps at each
  // tip, instead of a squashed sphere — reads as an actual cephalofoil
  const head = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.0, 8), mainMat);
  head.rotation.z = Math.PI / 2;
  head.scale.set(1, 1, 2.1);
  head.position.set(0, 1.68, 0.1);
  head.castShadow = true;
  head.name = "head";
  bodyGroup.add(head);
  [-1, 1].forEach(side => {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), mainMat);
    cap.scale.set(1, 1, 2.1);
    cap.position.set(side * 0.5, 1.68, 0.1);
    cap.name = "hammerCap_" + (side < 0 ? "L" : "R");
    bodyGroup.add(cap);
  });
  const snout = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.32, 10), mainMat);
  snout.rotation.x = Math.PI / 2;
  snout.position.set(0, 1.6, 0.42);
  snout.name = "snout";
  bodyGroup.add(snout);

  // eyes at the tips of the hammer
  [-1, 1].forEach(side => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), darkMat);
    eye.position.set(side * 0.54, 1.68, 0.22);
    eye.name = "eye_" + (side < 0 ? "L" : "R");
    bodyGroup.add(eye);
  });

  // gill slits
  for (let i = 0; i < 3; i++) {
    [-1, 1].forEach(side => {
      const gill = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.1, 0.02), darkMat);
      gill.position.set(side * 0.4, 1.15 - i * 0.09, 0.2);
      gill.rotation.z = side * 0.35;
      gill.name = "gill_" + i + "_" + (side < 0 ? "L" : "R");
      bodyGroup.add(gill);
    });
  }

  const dorsalFin = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.34, 4), darkMat);
  dorsalFin.scale.set(0.5, 1, 1);
  dorsalFin.position.set(0, 1.5, -0.35);
  dorsalFin.rotation.x = -0.15;
  dorsalFin.name = "dorsalFin";
  bodyGroup.add(dorsalFin);

  // two-segment arms (upper + forearm) so biceps read as defined masses
  [-1, 1].forEach(side => {
    const upperArm = makeCapsule(0.135, 0.42, mainMat);
    upperArm.position.set(side * 0.62, 1.12, 0);
    upperArm.rotation.z = side * 0.18;
    upperArm.name = "upperArm_" + (side < 0 ? "L" : "R");
    bodyGroup.add(upperArm);
    const forearm = makeCapsule(0.1, 0.4, mainMat);
    forearm.position.set(side * 0.7, 0.68, 0.08);
    forearm.rotation.z = side * 0.3;
    forearm.name = (side < 0 ? "armL" : "armR");
    bodyGroup.add(forearm);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), darkMat);
    hand.scale.set(0.8, 1, 0.4);
    hand.position.set(side * 0.76, 0.44, 0.14);
    hand.name = "hand_" + (side < 0 ? "L" : "R");
    bodyGroup.add(hand);

function buildMaquinaDeGuerraModel(bodyGroup, mainMat, accentMat, def) {
  // Máquina de Guerra — rebuilt from scratch to match the card art: a
  // FOUR-LEGGED mechanical-insect walker (not bipedal), low angular wedge
  // chassis, no humanoid head/jaw — the "face" is just the angled front
  // plate — spikes across the top, and a rear cannon barrel.
  const darkMat = mainMat.clone();
  darkMat.color.multiplyScalar(0.6);
  const rustMat = mainMat.clone();
  rustMat.color.set(0x9a5a30);
  const metalMat = mainMat.clone();
  metalMat.color.set(0x6a6a6a);
  const spikeMat = mainMat.clone();
  spikeMat.color.set(0xd8d0c0);

  const chassis = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.5, 1.3), mainMat);
  chassis.position.y = 0.62;
  chassis.castShadow = true;
  chassis.name = "torso";
  bodyGroup.add(chassis);

  // angled front plate — the "face" of the machine, no mandible/jaw
  const frontPlate = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.42, 0.3), darkMat);
  frontPlate.position.set(0, 0.68, 0.72);
  frontPlate.rotation.x = -0.3;
  frontPlate.castShadow = true;
  frontPlate.name = "head";
  bodyGroup.add(frontPlate);

  // spikes across the top/front ridge
  for (let i = 0; i < 5; i++) {
    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.22, 5), spikeMat);
    spike.position.set(-0.32 + i * 0.16, 0.94, 0.5 - i * 0.08);
    spike.rotation.x = -0.2;
    spike.name = "spike_" + i;
    bodyGroup.add(spike);
  }
  [-1, 1].forEach(side => {
    const hornSpike = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.35, 5), spikeMat);
    hornSpike.position.set(side * 0.3, 1.0, 0.75);
    hornSpike.rotation.x = -0.35;
    hornSpike.rotation.z = side * 0.2;
    hornSpike.name = "hornSpike_" + (side < 0 ? "L" : "R");
    bodyGroup.add(hornSpike);
  });

  // rear cannon barrel
  const weapon = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.5, 8), metalMat);
  weapon.rotation.x = Math.PI / 2;
  weapon.position.set(0, 0.7, -0.85);
  weapon.name = "weapon";
  bodyGroup.add(weapon);

  // rivets scattered on the chassis
  for (let i = 0; i < 6; i++) {
    const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.04, 6), metalMat);
    bolt.rotation.x = Math.PI / 2;
    bolt.position.set((i % 2 === 0 ? -1 : 1) * 0.38, 0.5 + (i % 3) * 0.12, -0.4 + i * 0.15);
    bolt.name = "bolt_" + i;
    bodyGroup.add(bolt);
  }

  // FOUR insect-like articulated legs — front pair angled forward, back
  // pair angled backward, a classic mechanical-spider stance, each built
  // from two segments meeting at a bent "knee" matching the reference art
  const legConfigs = [
    { x: -0.5, z: 0.5, bend: 1, id: "frontL" },
    { x: 0.5, z: 0.5, bend: 1, id: "frontR" },
    { x: -0.5, z: -0.5, bend: -1, id: "backL" },
    { x: 0.5, z: -0.5, bend: -1, id: "backR" }
  ];
  legConfigs.forEach(cfg => {
    const legGroup = new THREE.Group();
    legGroup.position.set(cfg.x, 0.55, cfg.z);
    const upper = makeCapsule(0.06, 0.4, darkMat);
    upper.position.set(0, -0.1, cfg.bend * 0.08);
    upper.rotation.x = cfg.bend * 0.5;
    upper.name = "legUpper_" + cfg.id;
    legGroup.add(upper);
    const lower = makeCapsule(0.05, 0.42, rustMat);
    lower.position.set(0, -0.42, cfg.bend * 0.32);
    lower.rotation.x = cfg.bend * -0.9;
    lower.name = "legLower_" + cfg.id;
    legGroup.add(lower);
    const foot = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.12, 6), metalMat);
    foot.position.set(0, -0.62, cfg.bend * 0.42);
    foot.rotation.x = Math.PI + cfg.bend * -0.9;
    foot.name = "foot_" + cfg.id;
    legGroup.add(foot);
    legGroup.name = "leg_" + cfg.id;
    bodyGroup.add(legGroup);
  });

  const core = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 12), accentMat);
  core.position.set(0, 0.65, 0.3);
  core.name = "core";
  bodyGroup.add(core);

  return [chassis, frontPlate];
}

  ajax: buildAjaxModel,
