function buildUnitModel(def) {
  const root = new THREE.Group();
  root.name = def.id + "_root";

  const bodyGroup = new THREE.Group();
  bodyGroup.name = "body";
  root.add(bodyGroup);

  const mainMat = new THREE.MeshToonMaterial({ color: def.color, gradientMap: TOON_GRADIENT });
  const accentMat = new THREE.MeshToonMaterial({ color: def.accentColor, gradientMap: TOON_GRADIENT, emissive: def.accentColor, emissiveIntensity: 0.35 });

  let torso, head, core;
  let outlineParts = null;

  const bespokeBuilder = BESPOKE_BUILDERS[def.shape];
  if (bespokeBuilder) {
    outlineParts = bespokeBuilder(bodyGroup, mainMat, accentMat, def);
    torso = bodyGroup.getObjectByName("torso");
    head = bodyGroup.getObjectByName("head");
    core = bodyGroup.getObjectByName("core");
  } else if (def.shape === "brute") {
    torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.6), mainMat);
    torso.position.y = 0.75;
    torso.castShadow = true;
    torso.name = "torso";
    bodyGroup.add(torso);

    head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), mainMat);
    head.position.y = 1.55;
    head.castShadow = true;
    head.name = "head";
    bodyGroup.add(head);

    // shoulder pads
    [-1, 1].forEach(side => {
      const shoulder = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.32, 0.32), accentMat);
      shoulder.position.set(side * 0.55, 1.15, 0);
      shoulder.name = "shoulder_" + (side < 0 ? "L" : "R");
      bodyGroup.add(shoulder);
    });

    // arms (named for animation targeting)
    const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.75, 8), mainMat);
    armL.position.set(-0.62, 0.75, 0);
    armL.name = "armL";
    armL.castShadow = true;
    bodyGroup.add(armL);

    const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.75, 8), mainMat);
    armR.position.set(0.62, 0.75, 0);
    armR.name = "armR";
    armR.castShadow = true;
    bodyGroup.add(armR);

    // weapon (right hand)
    const weapon = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.7, 6), accentMat);
    weapon.rotation.x = Math.PI;
    weapon.position.set(0.62, 0.15, 0);
    weapon.name = "weapon";
    bodyGroup.add(weapon);

    core = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 12), accentMat);
    core.position.set(0, 0.85, 0.32);
    core.name = "core";
    bodyGroup.add(core);

  } else { // caster
    torso = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.3, 8), mainMat);
    torso.position.y = 0.75;
    torso.castShadow = true;
    torso.name = "torso";
    bodyGroup.add(torso);

    head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), mainMat);
    head.position.y = 1.55;
    head.castShadow = true;
    head.name = "head";
    bodyGroup.add(head);

    const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.6, 8), mainMat);
    armL.position.set(-0.42, 0.85, 0);
    armL.rotation.z = 0.5;
    armL.name = "armL";
    bodyGroup.add(armL);

    const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.6, 8), mainMat);
    armR.position.set(0.42, 0.85, 0);
    armR.rotation.z = -0.5;
    armR.name = "armR";
    bodyGroup.add(armR);

    // floating orb "weapon"
    const weapon = new THREE.Mesh(new THREE.OctahedronGeometry(0.16, 0), accentMat);
    weapon.position.set(0.55, 1.05, 0.15);
    weapon.name = "weapon";
    bodyGroup.add(weapon);

    core = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), accentMat);
    core.position.set(0, 0.95, 0.28);
    core.name = "core";
    bodyGroup.add(core);

    // ring collar
    const collar = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.04, 8, 16), accentMat);
    collar.position.y = 1.25;
    collar.rotation.x = Math.PI / 2;
    collar.name = "collar";
    bodyGroup.add(collar);
  }

  // base/feet
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.45, 0.2, 10), mainMat);
  base.position.y = 0.1;
  base.castShadow = true;
  base.name = "base";
  bodyGroup.add(base);

  // Per-mesh toon outline (from babawibby_zoom_v3.html's addOutline/
  // makeToonMesh pattern): every individual mesh in the body gets its own
  // backface-scaled outline CHILD (not a separate top-level clone), so it
  // inherits that mesh's own transform automatically as parts move/animate.
  // This replaces the old torso/head-only outline, which left most bespoke
  // parts (fins, ears, backpack, halo, etc.) with no outline at all.
  const outlineMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide });
  const OUTLINE_SCALE = 1.06;
  bodyGroup.traverse(o => {
    if (o.isMesh && !o.userData.isOutline) {
      const outline = new THREE.Mesh(o.geometry, outlineMat);
      outline.scale.multiplyScalar(OUTLINE_SCALE);
      outline.name = (o.name || "part") + "_outline";
      outline.userData.isOutline = true;
      o.add(outline);
    }
  });

  return { root, bodyGroup, torso, head, core, weapon: bodyGroup.getObjectByName("weapon") };
}

// =============================================================
// ============ SECTION 6: THE UNIT CLASS ========================
// =============================================================
// A Unit bundles: combat state (hp/shield/alive) + a Three.js model
// + a per-unit "animations" table {idle, hurt, dead, skill1..3}.
// Combat engine mutates hp/shield/alive. Animation engine only
// reads position/model and calls the animations table.

// Index 3 ("summon slot") is only ever used by units created mid-battle via
// the `summon` effect verb (e.g. Babawibby's Máquina de Guerra) — the normal
// 3-unit roster (defender/attacker/support at 0/1/2) never occupies it. Kept
// a bit further back/wide so it doesn't visually crowd the starting trio.
const SLOT_POSITIONS = {
  player: [ new THREE.Vector3(-2.6, 0, 3.6), new THREE.Vector3(0, 0, 4.4), new THREE.Vector3(2.6, 0, 3.6), new THREE.Vector3(0, 0, 6.2) ],
  enemy:  [ new THREE.Vector3(-2.6, 0, -3.6), new THREE.Vector3(0, 0, -4.4), new THREE.Vector3(2.6, 0, -3.6), new THREE.Vector3(0, 0, -6.2) ]
};

let unitIdCounter = 0;

class Unit {
  constructor(def, slotIndex) {
    this.defId = def.id;
    this.uid = "u" + (unitIdCounter++);
    this.displayName = def.displayName;
    this.team = def.team;
    this.abilities = def.abilities;
    this.maxHP = def.stats.maxHP;
    this.hp = def.stats.maxHP;
    this.shield = 0;
    this.statuses = [];   // active StatusLib effects (bleed, untargetable, moveLast, ...)
    this.counters = {};   // named resource counters (e.g. Mariana's "protecao")
    this.alive = true;
    this.slotIndex = slotIndex;

    this.homePosition = SLOT_POSITIONS[def.team][slotIndex].clone();

    const modelParts = buildUnitModel(def);
    this.model = modelParts.root;
    this.body = modelParts.bodyGroup;
    this.core = modelParts.core;
    this.weapon = modelParts.weapon;
    this.model.position.copy(this.homePosition);
    // Face inward toward battlefield center
    this.model.rotation.y = def.team === "player" ? Math.PI : 0;

    scene.add(this.model);

    // Character-specific spawn flourish (e.g. Babawibby's pop-in + hop), if
    // this character has one. Fire-and-forget: doesn't block unit creation,
    // and idle takes over normally once it finishes.
    const spawnProfile = CHARACTER_ANIM_PROFILES[def.id];
    if (spawnProfile && spawnProfile.spawn) {
      const steps = spawnProfile.spawn(this);
      animRunner.playSequence(Array.isArray(steps) ? steps : [steps]);
    }

    this.idleClock = Math.random() * 10; // desync idle bobbing per unit
    this.idleActive = true;

    // ---- animations table: idle / hurt / dead / skill1-3 ----
    this.animations = buildUnitAnimations(this);
  }

  get position() { return this.model.position; }
  get hitPoint() { return this.model.position.clone().add(new THREE.Vector3(0, 1, 0)); }

  isValidTarget() { return this.alive; }
}

// =============================================================
// ============ MID-BATTLE ROSTER MUTATION (summons) ============
// =============================================================
// Generic support for the `summon` / `sacrificeAlly` effect verbs
// (js/effects.js). Any card can use these — not specific to one unit.
// Roster arrays (playerUnits/enemyUnits) and the live Three.js scene
// only exist here in game.html, so this is where the actual mutation
// has to happen; resolution.js just watches for the markers and calls in.

// Finds the first slot index not currently occupied by a living unit on
// that team, starting at 3 (index 0-2 are reserved for the starting trio).
// If every slot 3+ is somehow full (multiple summons), extends further.
function nextSummonSlot(team) {
  const roster = team === "player" ? playerUnits : enemyUnits;
  let idx = 3;
  while (roster.some(u => u.alive && u.slotIndex === idx)) idx++;
  // Extend SLOT_POSITIONS on the fly if we ever need slot 4+ (rare: would
  // require 2+ simultaneous summons on one team), reusing slot 3's position
  // offset further back so extra summons don't overlap on-screen.
  if (!SLOT_POSITIONS[team][idx]) {
    const base = SLOT_POSITIONS[team][3];
    SLOT_POSITIONS[team][idx] = new THREE.Vector3(base.x + (idx - 3) * 1.4, base.y, base.z + (idx - 3) * 0.6);
  }
  return idx;
}

// Instantiates a UNIT_DEFS entry as a live Unit, adds it to the correct
// roster array and the scene, and returns it. `summonedBy` and `tag` are
// stamped onto the new unit so a later `sacrificeAlly` step (optionally
// filtered by tag) can find it, and so UI/logging can attribute it.
function summonUnitFor(team, defId, tag, summonedBy) {
  const def = UNIT_DEFS[defId];
  if (!def) { console.warn('summonUnitFor: unknown defId', defId); return null; }
  const slotIndex = nextSummonSlot(team);
  const unit = new Unit(def, slotIndex);
  unit.summonTag = tag || defId;
  unit.summonedBy = summonedBy || null;
  if (team === "player") playerUnits.push(unit); else enemyUnits.push(unit);
  addLogLine(`${summonedBy ? summonedBy.displayName + ' invoca ' : ''}${unit.displayName}!`, 'info');
  refreshAllUnitUI();
  renderPartyRow();
  return unit;
}

// Removes a summoned (or any) unit from its team's roster and scene. Marks
// it dead/not-alive first so any in-flight targeting/AI logic that filters
// on `.alive` stops seeing it immediately, then detaches its model next
// frame (small delay avoids yanking the mesh out mid-animation-callback).
function removeUnitFromRoster(unit) {
  if (!unit) return;
  unit.alive = false;
  unit.hp = 0;
  const roster = unit.team === "player" ? playerUnits : enemyUnits;
  const idx = roster.indexOf(unit);
  if (idx !== -1) roster.splice(idx, 1);
  setTimeout(() => { scene.remove(unit.model); }, 50);
  refreshAllUnitUI();
  renderPartyRow();
}

// --- Per-unit animation library ---------------------------------
// Generalizes the Babawibby "move -> arrive -> event -> effect"
// chain into reusable idle/hurt/dead/skill routines that operate
// relative to actor/target positions (Section 10 requirement).

function buildUnitAnimations(unit) {
  const facing = unit.team === "player" ? -1 : 1; // player units face -Z (toward enemy), enemy face +Z

  return {
    // ---- IDLE: subtle breathing/bob + core glow pulse ----
    idle: {
      // handled per-frame in the render loop (continuous), not a one-shot sequence
    },

    // ---- HURT: impact squash, recoil, recover ----
    async hurt(magnitude = 1) {
      unit.idleActive = false;
      const knockDir = new THREE.Vector3(0, 0, facing * -0.18 * magnitude);
      const homeY = unit.body.position.y;
      await animRunner.playSequence([
        [
          squashStretchStep(unit.body, 1.18, 0.8, 1.18, 0.09, Easing.quadOut),
          callbackStep(() => { unit.body.position.add(knockDir); })
        ],
        waitStep(0.05),
        [
          squashStretchStep(unit.body, 1, 1, 1, 0.22, Easing.backOut),
          callbackStep(() => { unit.body.position.z -= knockDir.z; })
        ]
      ]);
      unit.idleActive = true;
    },

    // ---- DEAD: collapse and fade ----
    async dead() {
      unit.idleActive = false;
      await animRunner.playSequence([
        [
          { clip: new Clip(0.35, t => {
              unit.body.rotation.x = Easing.cubicIn(t) * (Math.PI / 2.1);
            }) },
          { clip: new Clip(0.35, t => {
              unit.body.position.y = 0.0 - Easing.cubicIn(t) * 0.15;
            }) }
        ],
        { clip: new Clip(0.4, t => {
            unit.body.traverse(o => { if (o.material && o.material.opacity !== undefined) { o.material.transparent = true; o.material.opacity = 1 - t; } });
          }) }
      ]);
      unit.model.visible = false;
    },

    // ---- SKILL 1: direct melee/bolt attack ----
    async skill1(target, onImpact, abilityType, abilityId) {
      await runAttackAnimation(unit, target, { arc: false, color: 0xffffff, onImpact, abilityId });
    },

    // ---- SKILL 2: support (shield) or secondary attack depending on def ----
    async skill2(target, onImpact, abilityType, abilityId) {
      if (abilityType === "shield") {
        await runSupportAnimation(unit, target, { color: 0xffe27a, onImpact, kind: "shield" });
      } else if (abilityType === "heal") {
        await runSupportAnimation(unit, target, { color: 0x7dffb0, onImpact, kind: "heal" });
      } else {
        await runAttackAnimation(unit, target, { arc: true, color: 0xffdca8, onImpact, abilityId });
      }
    },

    // ---- SKILL 3: heavier attack with bigger wind-up/impact ----
    async skill3(target, onImpact, abilityType, abilityId) {
      await runAttackAnimation(unit, target, { arc: true, heavy: true, color: 0xff5a5a, onImpact, abilityId });
    }
  };
}

// Shared "attack" choreography: wind-up -> approach -> attack -> impact event -> return.
async function runAttackAnimation(actor, target, opts) {
  const { color = 0xffffff, heavy = false, onImpact, abilityId } = opts;
  actor.idleActive = false;
  const startPos = actor.model.position.clone();
  const dir = new THREE.Vector3().subVectors(target.model.position, actor.model.position).normalize();
  const approachDist = heavy ? 1.7 : 1.4;
  const approachPos = new THREE.Vector3().copy(target.model.position).addScaledVector(dir, -0.9 * approachDist / 1.4 - 0.5);
  // simpler: stop short of target along the line from actor->target
  const stopShort = new THREE.Vector3().copy(target.model.position).addScaledVector(dir, -1.1);

  const windupScale = heavy ? 1.22 : 1.1;
  const profile = CHARACTER_ANIM_PROFILES[actor.defId];

  await animRunner.playSequence([
    // Wind-up
    squashStretchStep(actor.body, windupScale, 0.9, windupScale, heavy ? 0.22 : 0.14, Easing.quadOut),
    // Character-specific wind-up flourish layered on top, if this character has one
    ...(profile && profile.windup ? [profile.windup(actor)] : []),
    // Move toward target (relative targeting - uses live positions, not hard-coded coords)
    moveStep(actor.model, stopShort, heavy ? 0.32 : 0.24, Easing.cubicOut),
    // ATTACK EVENT: lunge + weapon swing
    [
      squashStretchStep(actor.body, 0.85, 1.15, 0.85, 0.09, Easing.quadOut),
      callbackStep(() => {
        if (actor.weapon) actor.weapon.rotation.x -= heavy ? 2.4 : 1.6;
      })
    ],
    // IMPACT EVENT — this is where gameplay effect fires, synced to the visual hit
    callbackStep(() => {
      spawnImpactRing(target.hitPoint, color, heavy ? 1.3 : 0.9);
      spawnBurst({ position: target.hitPoint, color, count: heavy ? 16 : 10, speed: heavy ? 3.2 : 2.4 });
      triggerCameraShake(heavy ? 0.22 : 0.1, heavy ? 0.28 : 0.16);
      if (onImpact) onImpact(); // <-- gameplay damage applied here, not on button press
    }),
    // Character+ability-specific impact plug-in visual (e.g. Ajax's boxing
    // glove / bite jaw), if this character/ability combination has one
    ...(() => {
      if (!profile || !profile.attackImpact) return [];
      const step = profile.attackImpact(actor, target, abilityId);
      return step ? [step] : [];
    })(),
    // Recovery + return home
    [
      squashStretchStep(actor.body, 1, 1, 1, 0.18, Easing.backOut),
      callbackStep(() => { if (actor.weapon) actor.weapon.rotation.x = 0; })
    ],
    moveStep(actor.model, startPos, heavy ? 0.3 : 0.22, Easing.cubicOut)
  ]);
  actor.idleActive = true;
}

// Shared "support" choreography for heal/shield: caster raises hands, projectile/beam travels, effect lands on ally.
async function runSupportAnimation(actor, target, opts) {
  const { color, onImpact, kind } = opts;
  actor.idleActive = false;
  await animRunner.playSequence([
    squashStretchStep(actor.body, 1.12, 1.08, 1.12, 0.18, Easing.quadOut),
    callbackStep(() => {
      spawnBurst({ position: actor.hitPoint, color, count: 6, speed: 1.2, spread: 0.3 });
    }),
    waitStep(0.12),
    callbackStep(() => {
      // traveling effect line rendered as a quick burst along the path
      const mid = new THREE.Vector3().addVectors(actor.hitPoint, target.hitPoint).multiplyScalar(0.5);
      spawnProjectileTrail(mid, color);
    }),
    waitStep(0.14),
    // Effect lands
    callbackStep(() => {
      spawnImpactRing(target.hitPoint, color, kind === "shield" ? 1.1 : 0.85);
      spawnBurst({ position: target.hitPoint, color, count: 14, speed: 2, gravity: kind === "heal" ? -1 : -3 });
      if (onImpact) onImpact();
    }),
    [
      squashStretchStep(actor.body, 1, 1, 1, 0.2, Easing.backOut),
      squashStretchStep(target.body, kind === "shield" ? 1.1 : 1.08, kind === "shield" ? 1.1 : 1.12, kind === "shield" ? 1.1 : 1.08, 0.16, Easing.backOut)
    ],
    waitStep(0.08),
    scaleStep(target.body, 1, 0.18, Easing.quadOut)
  ]);
  actor.idleActive = true;
}

// =============================================================
// ============ SECTION 7: COMBAT ENGINE =========================
// =============================================================
// Pure gameplay logic. Knows nothing about Three.js, animations,
// particles, or rendering. Produces "combat results" that the
// orchestrator (Section 9) hands to the animation engine.

// CombatEngine now loaded from js/combat-engine.js (effect-pipeline based)

// =============================================================
// ============ SECTION 8: SIMPLE AI ==============================
// =============================================================
// Uses the exact same CombatEngine + AnimationEngine pipeline as
// the player. The AI only decides WHO/WHAT/WHOM, then submits an
// action through submitAction(), same as clicking buttons does.

const AI = {
  // Legacy whole-team decision (kept for reference/compatibility) — picks one actor+ability+target.
  decide(aiUnits, enemyUnits) {
    const livingActors = aiUnits.filter(u => u.alive);
    if (livingActors.length === 0) return null;
    for (const actor of livingActors) {
      const d = this.decideForActor(actor, aiUnits, enemyUnits);
      if (d) return d;
    }
    return null;
  },

  // Speed-based combat plans every actor individually, since all actions
  // for both sides are committed up front before any of them resolve.
  // This is the version used by the resolution phase (Section 10).
  decideForActor(actor, aiUnits, enemyUnits) {
    if (!actor.alive) return null;
    const livingTargets = enemyUnits.filter(u => u.alive);
    if (livingTargets.length === 0) return null;

    const damagedAllies = aiUnits.filter(u => u.alive && u.hp < u.maxHP * 0.6);
    const candidates = [];

    for (const ability of actor.abilities) {
      const flavor = primaryEffectType(ability);
      const dmgStep = ability.effects.find(e => e.verb === 'damage' && (e.target === 'target' || !e.target));
      const abilityPower = dmgStep ? (typeof dmgStep.amount === 'function' ? 0 : dmgStep.amount) : 0;

      if (flavor === "heal" && damagedAllies.length > 0) {
        const healTarget = damagedAllies.reduce((a, b) => (a.hp / a.maxHP) < (b.hp / b.maxHP) ? a : b);
        candidates.push({ actor, ability, target: healTarget, weight: 3 });
      } else if (flavor === "shield") {
        const unshielded = aiUnits.filter(u => u.alive && u.shield < 5);
        if (unshielded.length > 0) {
          const shieldTarget = unshielded[Math.floor(Math.random() * unshielded.length)];
          candidates.push({ actor, ability, target: shieldTarget, weight: 1.5 });
        }
      } else if (flavor === "attack") {
        for (const target of livingTargets) {
          let weight = 1;
          if (abilityPower > 0 && target.hp <= abilityPower) weight += 2.5; // can score a kill
          if (target.hp / target.maxHP < 0.35) weight += 1.5;
          candidates.push({ actor, ability, target, weight });
        }
      } else {
        // Any other flavor (e.g. a pure utility ability): just try it on a random enemy so it isn't dead weight.
        candidates.push({ actor, ability, target: livingTargets[Math.floor(Math.random() * livingTargets.length)], weight: 0.5 });
      }
    }

    if (candidates.length === 0) {
      // Fall back to any attack-flavored ability against a random living target
      const atk = actor.abilities.find(a => primaryEffectType(a) === 'attack');
      if (atk) return { actor, ability: atk, target: livingTargets[Math.floor(Math.random() * livingTargets.length)] };
      return null;
    }

    const totalWeight = candidates.reduce((s, c) => s + c.weight, 0);
    let r = Math.random() * totalWeight;
    for (const c of candidates) {
      r -= c.weight;
      if (r <= 0) return c;
    }
    return candidates[candidates.length - 1];
  }
};

// =============================================================
// ============ SECTION 9: ANIMATION ENGINE (ORCHESTRATOR) ======
// =============================================================
// This is the bridge: combat.resolve() -> animation plays ->
// impact event fires -> combat.apply() -> UI updates -> hurt/dead.
// Same function is called for BOTH player actions and AI actions.

const AnimationEngine = {
  async play({ actor, ability, target, playerUnits, enemyUnits, round, echo, secondTarget }) {
    const result = CombatEngine.resolve(actor, ability, target, { playerUnits, enemyUnits, round, echoChoice: echo || null, secondTarget: secondTarget || null });

    const applyAndReact = async () => {
      CombatEngine.apply(result);
      renderFloatingNumbers(result);
      refreshAllUnitUI();
      logResult(result);

      // Multi-effect abilities (e.g. Ajax's Duelo hits both sides, Corrente
      // Fatal can hit 2-3 times) trigger a hurt/dead reaction on EVERY
      // unit that actually took damage this action, not just `target`.
      const damageHits = (result.applied || []).filter(a => a.verb === 'damage' && a.actualDamage > 0);
      const reactedUnits = new Set();
      for (const hit of damageHits) {
        const victim = hit.target;
        if (!victim || reactedUnits.has(victim)) continue;
        reactedUnits.add(victim);
        if (hit.killed) {
          await victim.animations.hurt(1.4);
          await victim.animations.dead();
        } else {
          await victim.animations.hurt(hit.actualDamage >= 9 ? 1.3 : 0.9);
        }
      }
    };

    const animKey = ability.animKey || "skill1";
    if (animKey === "skill2") {
      await actor.animations.skill2(target, applyAndReact, primaryEffectType(ability), ability.id);
    } else if (animKey === "skill3") {
      await actor.animations.skill3(target, applyAndReact, primaryEffectType(ability), ability.id);
    } else {
      await actor.animations.skill1(target, applyAndReact, primaryEffectType(ability), ability.id);
    }

    return result;
  }
};

function renderFloatingNumbers(result) {
  // Walks every applied effect (not just a single "primary" one) so multi-hit
  // abilities (Ajax's Duelo/Corrente Fatal) and multi-verb abilities (damage +
  // status, gainCounter, etc.) all get appropriate floating text.
  for (const a of (result.applied || [])) {
    if (!a.target) continue;
    const screenPos = worldToScreen(a.target.hitPoint);
    if (a.verb === 'damage' && a.actualDamage > 0) {
      spawnFloatText(screenPos, "-" + a.actualDamage, "dmg");
      if (a.absorbedByShield) {
        spawnFloatText({ x: screenPos.x, y: screenPos.y - 16 }, "🛡" + a.absorbedByShield, "shield");
      }
    } else if (a.verb === 'heal' && a.actualHeal > 0) {
      spawnFloatText(screenPos, "+" + a.actualHeal, "heal");
    } else if (a.verb === 'shield') {
      spawnFloatText(screenPos, "+" + a.amount + " 🛡", "shield");
    } else if (a.verb === 'gainCounter') {
      spawnFloatText(screenPos, "+" + a.amount + " ✦", "shield");
    } else if (a.verb === 'applyStatus') {
      spawnFloatText(screenPos, a.status.name, "shield");
    }
  }
}

function spawnFloatText(screenPos, text, cls) {
  const el = document.createElement('div');
  el.className = 'float-text ' + cls;
  el.style.left = screenPos.x + 'px';
  el.style.top = screenPos.y + 'px';
  el.textContent = text;
  document.getElementById('label-layer').appendChild(el);
  setTimeout(() => el.remove(), 1150);
}

function logResult(result) {
  const a = result.actor.displayName, ab = result.ability.name;
  addLogLine(`${a} uses ${ab}`, 'info');
  for (const eff of (result.applied || [])) {
    const t = eff.target ? eff.target.displayName : '?';
    if (eff.verb === 'damage' && eff.actualDamage > 0) {
      let msg = `  → ${t} takes ${eff.actualDamage} dmg`;
      if (eff.absorbedByShield) msg += ` (${eff.absorbedByShield} blocked)`;
      if (eff.killed) msg += ` — defeated!`;
      addLogLine(msg, 'hit');
    } else if (eff.verb === 'heal' && eff.actualHeal > 0) {
      addLogLine(`  → ${t} healed for ${eff.actualHeal}`, 'heal');
    } else if (eff.verb === 'shield') {
      addLogLine(`  → ${t} shielded for ${eff.amount}`, 'heal');
    } else if (eff.verb === 'applyStatus') {
      addLogLine(`  → ${t} gains ${eff.status.name}`, 'info');
    } else if (eff.verb === 'gainCounter') {
      addLogLine(`  → ${t} gains ${eff.amount} ${eff.counter} (${eff.newTotal} total)`, 'info');
    } else if (eff.verb === 'spendCounters') {
      addLogLine(`  → ${t} spends ${eff.spent} ${eff.counter}`, 'info');
    } else if (eff.verb === 'note') {
      addLogLine(`  → ${eff.text}`, 'info');
    }
  }
}

// =============================================================
// ============ SECTION 10: GAME STATE & FLOW ORCHESTRATION =====
// =============================================================

let playerUnits = [];
let enemyUnits = [];
let selectedUnit = null;      // which of MY units is currently being assigned an ability (planning phase)
let selectedAbility = null;   // ability chosen for selectedUnit, awaiting a target
let inputLocked = false;      // true while resolution phase is animating
let gameOver = false;
let phase = 'planning';       // 'planning' | 'resolving'

// Round plan: one entry per living player unit, filled in as the player assigns abilities.
// Each entry: { actor, ability, target, echo? }
// `echo` (optional): { ability, target } — the player's chosen secondary
// ability+target for abilities flagged `promptsEcho: true` (e.g. Yvrel's
// Golpe Eco). Consumed by the useAbilityOn effect step via ctx.echoChoice.
let playerPlan = [];

// Echo sub-selection state: active while the player is choosing the SECOND
// ability+target for a `promptsEcho` ability, after the primary target is
// already picked. null when not in this sub-flow.
// Shape: { actor, primaryAbility, primaryTarget, chosenEchoAbility }
let echoSubMode = null;

// Simpler two-step targeting for abilities that need a second target of a
// FIXED type (no ability re-choice involved) — e.g. Babawibby's "Destrua
// uma Máquina de Guerra": pick the ally (machine) to sacrifice, then pick
// the enemy who takes the resulting damage. Shape while active:
// { actor, ability, primaryTarget, secondTargetType }
// null when not in this sub-flow.
let secondTargetMode = null;

const labelLayer = document.getElementById('label-layer');
const partyRow = document.getElementById('party-row');
const abilityRow = document.getElementById('ability-row');
const statusLine = document.getElementById('status-line');
const turnIndicator = document.getElementById('turn-indicator');
const logPanel = document.getElementById('log-panel');
const logToggle = document.getElementById('log-toggle');
const overlay = document.getElementById('overlay');

function initGame(chosenPlayerOrder) {
  // Clear existing
  [...playerUnits, ...enemyUnits].forEach(u => scene.remove(u.model));
  const order = chosenPlayerOrder || PLAYER_ORDER;
  playerUnits = order.map((id, i) => new Unit(UNIT_DEFS[id], i));
  enemyUnits = ENEMY_ORDER.map((id, i) => new Unit(UNIT_DEFS[id], i));
  selectedUnit = null;
  selectedAbility = null;
  echoSubMode = null;
  inputLocked = false;
  gameOver = false;
  phase = 'planning';
  setCameraOrbitEnabled(true);
  playerPlan = [];
  logPanel.innerHTML = '';
  overlay.classList.remove('show');
  setTurnIndicator('planning');
  buildLabelLayer();
  renderPartyRow();
  renderAbilityRow();
  updateStatus("Choose an ability for each of your units");
}

function setTurnIndicator(who) {
  if (who === 'planning') { turnIndicator.textContent = 'PLAN YOUR TURN'; turnIndicator.className = 'player-turn'; }
  else if (who === 'resolving') { turnIndicator.textContent = 'RESOLVING…'; turnIndicator.className = 'enemy-turn'; }
}

// =============================================================
// ============ PRE-GAME TEAM SELECT ==============================
// =============================================================
// Lets the player pick exactly one card per role (defender/attacker/
// support) before the battle starts, instead of always fielding the
// hardcoded PLAYER_ORDER trio. Draws candidates from every UNIT_DEFS
// entry with team:"player" — EXCEPT summon-only units (units that are
// only ever created mid-battle via the `summon` effect verb, like
// Máquina de Guerra) which aren't meant to be drafted as a starting card.
const SUMMON_ONLY_UNIT_IDS = new Set(["maquina_de_guerra"]);
const ROLE_ORDER = ["defender", "attacker", "support"];

function playerDraftPool() {
  const pool = { defender: [], attacker: [], support: [] };
  for (const def of Object.values(UNIT_DEFS)) {
    if (def.team !== "player") continue;
    if (SUMMON_ONLY_UNIT_IDS.has(def.id)) continue;
    if (pool[def.role]) pool[def.role].push(def);
  }
  return pool;
}

let draftPicks = {}; // role -> defId

function openTeamSelect() {
  draftPicks = {};
  const pool = playerDraftPool();
  const groupsEl = document.getElementById('team-select-groups');
  groupsEl.innerHTML = '';

  ROLE_ORDER.forEach(role => {
    const group = document.createElement('div');
    group.className = 'ts-role-group';
    const label = document.createElement('div');
    label.className = 'ts-role-label';
    label.textContent = role;
    group.appendChild(label);

    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'ts-cards';
    (pool[role] || []).forEach(def => {
      const card = document.createElement('div');
      card.className = 'ts-card';
      card.innerHTML = `<div class="ts-name">${def.displayName}</div><div class="ts-hp">HP ${def.stats.maxHP}</div>`;
      card.addEventListener('click', () => {
        draftPicks[role] = def.id;
        cardsWrap.querySelectorAll('.ts-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        refreshTeamSelectConfirm();
      });
      cardsWrap.appendChild(card);
    });
    group.appendChild(cardsWrap);
    groupsEl.appendChild(group);
  });

  refreshTeamSelectConfirm();
  document.getElementById('team-select').classList.add('show');
}

function refreshTeamSelectConfirm() {
  const ready = ROLE_ORDER.every(role => draftPicks[role]);
  document.getElementById('team-select-confirm').classList.toggle('ready', ready);
}

document.getElementById('team-select-confirm').addEventListener('click', () => {
  if (!ROLE_ORDER.every(role => draftPicks[role])) return;
  const chosenOrder = ROLE_ORDER.map(role => draftPicks[role]); // [defender, attacker, support] slot order
  lastChosenPlayerOrder = chosenOrder;
  document.getElementById('team-select').classList.remove('show');
  initGame(chosenOrder);
});

function updateStatus(text) { statusLine.textContent = text; }

function addLogLine(msg, cls) {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = msg;
  logPanel.appendChild(div);
  logPanel.scrollTop = logPanel.scrollHeight;
}

logToggle.addEventListener('click', () => {
  logPanel.classList.toggle('open');
  logToggle.textContent = logPanel.classList.contains('open') ? 'Log ▴' : 'Log ▾';
});

// --- Label layer: name/hp/shield tags + selection rings + target rings ---
function buildLabelLayer() {
  labelLayer.innerHTML = '';
  [...playerUnits, ...enemyUnits].forEach(u => {
    const label = document.createElement('div');
    label.className = 'unit-label';
    label.id = 'label_' + u.uid;
    label.innerHTML = `
      <div class="name">${u.displayName}</div>
      <div class="hp-bar-bg"><div class="hp-bar-fill ${u.team}" style="width:100%"></div></div>
      <div class="hp-text">${u.hp}/${u.maxHP}</div>
      <div class="shield-pip" style="display:none;"></div>
      <div class="status-row"></div>
    `;
    labelLayer.appendChild(label);
  });
}

function worldToScreen(worldPos) {
  const v = worldPos.clone().project(camera);
  const rect = canvasWrap.getBoundingClientRect();
  return {
    x: (v.x * 0.5 + 0.5) * rect.width,
    y: (-(v.y * 0.5) + 0.5) * rect.height
  };
}

function updateLabelPositions() {
  [...playerUnits, ...enemyUnits].forEach(u => {
    const label = document.getElementById('label_' + u.uid);
    if (!label) return;
    if (!u.alive) { label.style.opacity = '0'; return; }
    label.style.opacity = '1';
    const screenPos = worldToScreen(u.model.position.clone().add(new THREE.Vector3(0, 1.9, 0)));
    label.style.left = screenPos.x + 'px';
    label.style.top = screenPos.y + 'px';
  });
}

// Persistent status/counter display under each unit's HP bar. Reads
// generically off u.statuses (array of StatusLib objects: {id, name, kind,
// data}) and u.counters (plain { counterId: value } map) — no hardcoding
// of "bleed" or "protecao" specifically, so any new status/counter a
// future card introduces shows up automatically.
function renderStatusRow(label, u) {
  const row = label.querySelector('.status-row');
  if (!row) return;
  row.innerHTML = '';

  (u.statuses || []).forEach(s => {
    const pip = document.createElement('div');
    pip.className = 'status-pip status-kind-' + (s.kind || 'other');
    let text = s.name || s.id;
    // Show a small hint of the status's payload when it's a per-tick
    // number (e.g. bleed's damagePerTick), so it's not just a bare label.
    if (s.data && typeof s.data.damagePerTick === 'number') {
      text += ' ' + s.data.damagePerTick;
    }
    pip.textContent = text;
    row.appendChild(pip);
  });

  Object.entries(u.counters || {}).forEach(([counterId, value]) => {
    if (!value) return; // skip zeroed-out counters
    const pip = document.createElement('div');
    pip.className = 'status-pip counter-pip';
    const label_ = counterId.charAt(0).toUpperCase() + counterId.slice(1);
    pip.textContent = label_ + ': ' + value;
    row.appendChild(pip);
  });
}

function refreshAllUnitUI() {
  [...playerUnits, ...enemyUnits].forEach(u => {
    const label = document.getElementById('label_' + u.uid);
    if (label) {
      const pct = Math.max(0, (u.hp / u.maxHP) * 100);
      label.querySelector('.hp-bar-fill').style.width = pct + '%';
      label.querySelector('.hp-text').textContent = `${u.hp}/${u.maxHP}`;
      const shieldEl = label.querySelector('.shield-pip');
      if (u.shield > 0) { shieldEl.style.display = 'block'; shieldEl.textContent = '🛡' + u.shield; }
      else { shieldEl.style.display = 'none'; }
      if (!u.alive) label.classList.add('dead'); else label.classList.remove('dead');
      renderStatusRow(label, u);
    }
  });
  renderPartyRow();
  renderAbilityRow();
  renderTargetRings();
}

// --- Helpers for the planning queue ---
function planEntryFor(unit) { return playerPlan.find(p => p.actor === unit); }
function livingPlayerUnits() { return playerUnits.filter(u => u.alive); }
function allPlanned() { return livingPlayerUnits().every(u => planEntryFor(u)); }

// --- Bottom party row (unit selector during planning) ---
function renderPartyRow() {
  partyRow.innerHTML = '';
  playerUnits.forEach(u => {
    const card = document.createElement('div');
    const planned = planEntryFor(u);
    card.className = 'party-card'
      + (u === selectedUnit || (echoSubMode && u === echoSubMode.actor) || (secondTargetMode && u === secondTargetMode.actor) ? ' selected' : '')
      + (!u.alive ? ' dead' : '')
      + (planned && phase === 'planning' ? ' queued' : '');
    const pct = Math.max(0, (u.hp / u.maxHP) * 100);
    const queuedLine = planned ? `<div class="pc-hptext" style="color:#7dffb0;">✓ ${planned.ability.name}</div>` : '';
    card.innerHTML = `
      <div class="pc-name">${u.displayName}</div>
      <div class="pc-hpwrap"><div class="pc-hpfill" style="width:${pct}%"></div></div>
      <div class="pc-hptext">${u.hp}/${u.maxHP}${u.shield > 0 ? ' 🛡' + u.shield : ''}</div>
      ${queuedLine}
    `;
    if (u.alive && phase === 'planning' && !gameOver) {
      card.addEventListener('click', () => selectUnit(u));
    }
    partyRow.appendChild(card);
  });

  // "Fight!" trigger card, shown once every living unit has a queued action
  if (phase === 'planning' && !gameOver && livingPlayerUnits().length > 0 && allPlanned()) {
    const fightCard = document.createElement('div');
    fightCard.className = 'party-card';
    fightCard.style.borderColor = '#7dffb0';
    fightCard.style.background = 'rgba(125,255,176,0.14)';
    fightCard.innerHTML = `<div class="pc-name" style="color:#7dffb0;">⚔ FIGHT!</div>`;
    fightCard.addEventListener('click', beginResolutionPhase);
    partyRow.appendChild(fightCard);
  }
}

function selectUnit(u) {
  if (phase !== 'planning' || gameOver || !u.alive) return;
  cancelEchoSubMode();
  selectedUnit = u;
  selectedAbility = null;
  const existing = planEntryFor(u);
  updateStatus(existing ? `${u.displayName} — currently set to ${existing.ability.name}. Pick again to change.` : `${u.displayName} selected — choose an ability`);
  renderPartyRow();
  renderAbilityRow();
  renderTargetRings();
}

// --- Ability row ---
function renderAbilityRow() {
  abilityRow.innerHTML = '';

  // Second-target sub-flow: ability + primary target already chosen, now
  // just waiting on the second (fixed-type) target — show it locked, same
  // treatment as the echo "ability already chosen" state above.
  if (secondTargetMode) {
    const ability = secondTargetMode.ability;
    const btn = document.createElement('div');
    btn.className = 'ability-btn queued';
    btn.style.borderColor = '#fff';
    btn.innerHTML = `<div>${ability.name} <span class="ab-speed">⚡${ability.speed}</span></div><div class="ab-desc">${ability.desc}</div>`;
    abilityRow.appendChild(btn);
    for (let i = 0; i < 2; i++) {
      const empty = document.createElement('div');
      empty.className = 'ability-btn empty';
      abilityRow.appendChild(empty);
    }
    return;
  }

  // Echo sub-flow: showing the actor's OTHER abilities so the player can
  // pick which one to echo (excludes echostrike itself and whatever
  // ability the actor last used, same exclusion rule the old random-pick
  // logic used).
  if (echoSubMode && !echoSubMode.chosenEchoAbility) {
    const actor = echoSubMode.actor;
    const last = CombatEngine.lastAbilityId(actor);
    const eligible = actor.abilities.filter(a => a.id !== echoSubMode.primaryAbility.id && a.id !== last);
    if (eligible.length === 0) {
      // No valid ability to echo (shouldn't normally happen with a 3-ability
      // kit, but guard anyway) — fizzle the echo and finalize as a plain action.
      playerPlan = playerPlan.filter(p => p.actor !== actor);
      playerPlan.push({ actor, ability: echoSubMode.primaryAbility, target: echoSubMode.primaryTarget });
      updateStatus(`${actor.displayName} has no other ability to echo right now — Golpe Eco queued without an echo.`);
      echoSubMode = null;
      renderPartyRow(); renderAbilityRow(); renderTargetRings();
      return;
    }
    eligible.forEach(ability => {
      const btn = document.createElement('div');
      btn.className = 'ability-btn';
      btn.innerHTML = `<div>${ability.name} <span class="ab-speed">⚡${ability.speed}</span></div><div class="ab-desc">${ability.desc}</div>`;
      btn.addEventListener('click', () => selectEchoAbility(ability));
      abilityRow.appendChild(btn);
    });
    return;
  }

  // Echo sub-flow: ability already chosen, now just waiting on a target —
  // show it highlighted/locked so the player can see what they picked.
  if (echoSubMode && echoSubMode.chosenEchoAbility) {
    const ability = echoSubMode.chosenEchoAbility;
    const btn = document.createElement('div');
    btn.className = 'ability-btn queued';
    btn.style.borderColor = '#fff';
    btn.innerHTML = `<div>${ability.name} <span class="ab-speed">⚡${ability.speed}</span></div><div class="ab-desc">${ability.desc}</div>`;
    abilityRow.appendChild(btn);
    for (let i = 0; i < 2; i++) {
      const empty = document.createElement('div');
      empty.className = 'ability-btn empty';
      abilityRow.appendChild(empty);
    }
    return;
  }

  if (!selectedUnit) {
    for (let i = 0; i < 3; i++) {
      const btn = document.createElement('div');
      btn.className = 'ability-btn empty';
      abilityRow.appendChild(btn);
    }
    return;
  }
  const existing = planEntryFor(selectedUnit);
  selectedUnit.abilities.forEach(ability => {
    const btn = document.createElement('div');
    const isQueued = existing && existing.ability === ability;
    btn.className = 'ability-btn'
      + (ability === selectedAbility ? '' : '')
      + (phase !== 'planning' ? ' disabled' : '')
      + (isQueued ? ' queued' : '');
    btn.innerHTML = `<div>${ability.name} <span class="ab-speed">⚡${ability.speed}</span></div><div class="ab-desc">${ability.desc}</div>`;
    if (phase === 'planning') {
      btn.addEventListener('click', () => selectAbility(ability));
      if (ability === selectedAbility) btn.style.borderColor = '#fff';
    }
    abilityRow.appendChild(btn);
  });
}

function selectAbility(ability) {
  if (phase !== 'planning' || gameOver) return;
  selectedAbility = ability;
  const targetType = ability.targetType || 'enemy';

  if (targetType === 'self') {
    // No target prompt needed — the ability always acts on its own caster
    // (e.g. Babawibby's "Crie uma Máquina de Guerra"). Finalize immediately.
    queuePlayerAction(selectedUnit);
    return;
  }

  updateStatus(targetType === 'ally' ? `Choose an ally for ${ability.name}` : `Choose an enemy target for ${ability.name}`);
  renderAbilityRow();
  renderTargetRings();
}

// --- Target rings drawn over valid targets ---
// Tracks the ring DOM elements currently on screen so renderTargetRings()
// can reposition them in place on most calls, instead of unconditionally
// deleting and recreating every element. Recreating elements every ~100ms
// was the root cause of the "targeting needs several taps" bug: if a
// wipe-and-recreate landed between a touch's pointerdown and pointerup/
// click, the DOM node the gesture started on no longer existed by the
// time the click would fire, silently dropping the tap.
let targetRingState = {
  selectedUnit: null,
  selectedAbility: null,
  selRingEl: null,
  targetRingEls: new Map() // unit.uid -> ring element
};

function renderTargetRings() {
  // Resolve the "effective" unit/ability driving ring display — either the
  // normal selection, the echo sub-flow (after an echo ability is chosen),
  // or the second-target sub-flow (fixed-type second target, e.g.
  // Babawibby's sacrifice-then-damage), so target rings can be shown for
  // whichever pick is currently pending, reusing all the same DOM/click logic.
  const inSecondTargetFlow = !!secondTargetMode;
  const effectiveUnit = inSecondTargetFlow ? secondTargetMode.actor
    : (echoSubMode && echoSubMode.chosenEchoAbility) ? echoSubMode.actor : selectedUnit;
  const effectiveAbility = inSecondTargetFlow ? secondTargetMode.ability
    : (echoSubMode && echoSubMode.chosenEchoAbility) ? echoSubMode.chosenEchoAbility : selectedAbility;

  if (!effectiveUnit || phase !== 'planning') {
    clearTargetRings();
    return;
  }

  // While mid echo-sub-flow, the echoed ability always targets an ally,
  // regardless of that ability's own default targetType. While mid
  // second-target-sub-flow, use the fixed type the ability declared.
  const inEchoSubFlow = !!(echoSubMode && echoSubMode.chosenEchoAbility);
  const targetType = inSecondTargetFlow ? secondTargetMode.secondTargetType
    : effectiveAbility ? (inEchoSubFlow ? 'ally' : (effectiveAbility.targetType || 'enemy')) : null;
  let pool = effectiveAbility ? (targetType === 'ally' ? playerUnits : enemyUnits).filter(u => u.alive) : [];
  // Some abilities only make sense against a subset of that pool (e.g.
  // Babawibby's "Destrua uma Máquina de Guerra" should only ever be aimed
  // at a summoned Máquina de Guerra, not any ally). `targetFilter` on the
  // ability def, if present, narrows the pool further. Doesn't apply during
  // the second-target sub-flow — that pool is always the plain fixed type.
  if (effectiveAbility && !inEchoSubFlow && !inSecondTargetFlow && effectiveAbility.targetFilter) {
    pool = pool.filter(u => effectiveAbility.targetFilter(u));
  }

  // Only tear down and rebuild the ring SET when the selection itself
  // changed (different unit, different ability, or the living-target
  // pool changed e.g. someone died). Otherwise just reposition the
  // existing elements — cheap, and never removes a node mid-gesture.
  const selectionChanged = targetRingState.selectedUnit !== effectiveUnit
    || targetRingState.selectedAbility !== effectiveAbility
    || targetRingState.targetRingEls.size !== pool.length
    || pool.some(u => !targetRingState.targetRingEls.has(u.uid));

  if (selectionChanged) {
    clearTargetRings();
    targetRingState.selectedUnit = effectiveUnit;
    targetRingState.selectedAbility = effectiveAbility;

    const ring = document.createElement('div');
    ring.className = 'selected-ring';
    labelLayer.appendChild(ring);
    targetRingState.selRingEl = ring;

    if (effectiveAbility) {
      pool.forEach(u => {
        const tRing = document.createElement('div');
        tRing.className = 'targetable-ring';
        tRing.addEventListener('click', () => queuePlayerAction(u));
        labelLayer.appendChild(tRing);
        targetRingState.targetRingEls.set(u.uid, tRing);
      });
    }
  }

  // Reposition (every call): target positions can drift slightly during
  // hit-shake etc., so keep coordinates fresh without touching the DOM
  // node identity.
  const selPos = worldToScreen(effectiveUnit.model.position.clone().add(new THREE.Vector3(0, 0.05, 0)));
  targetRingState.selRingEl.style.left = selPos.x + 'px';
  targetRingState.selRingEl.style.top = selPos.y + 'px';

  pool.forEach(u => {
    const el = targetRingState.targetRingEls.get(u.uid);
    if (!el) return;
    const pos = worldToScreen(u.model.position.clone().add(new THREE.Vector3(0, 0.05, 0)));
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';
  });
}

function clearTargetRings() {
  document.querySelectorAll('.targetable-ring, .selected-ring').forEach(el => el.remove());
  targetRingState.selectedUnit = null;
  targetRingState.selectedAbility = null;
  targetRingState.selRingEl = null;
  targetRingState.targetRingEls.clear();
}

// --- Queue (not execute) the player's chosen action for this unit ---
function queuePlayerAction(target) {
  if (phase !== 'planning' || gameOver) return;

  // Branch 0: we're in the second-target sub-flow (fixed-type second
  // target, no ability re-choice — e.g. Babawibby's sacrifice-then-damage).
  if (secondTargetMode) {
    finalizeSecondTargetPlan(target);
    return;
  }

  // Branch 1: we're in the echo sub-flow, picking a TARGET for the
  // already-chosen secondary ability.
  if (echoSubMode && echoSubMode.chosenEchoAbility) {
    finalizeEchoPlan(target);
    return;
  }

  if (!selectedUnit || !selectedAbility) return;
  const actor = selectedUnit, ability = selectedAbility;

  if (ability.promptsEcho) {
    // Don't finalize the plan entry yet — stash the primary choice and
    // enter the echo sub-flow: pick a different ability next, then a
    // target for THAT ability.
    echoSubMode = { actor, primaryAbility: ability, primaryTarget: target, chosenEchoAbility: null };
    selectedUnit = null; selectedAbility = null;
    updateStatus(`${ability.name} vai acertar. Agora escolha outra habilidade de ${actor.displayName} para ecoar.`);
    renderPartyRow(); renderAbilityRow(); renderTargetRings();
    return;
  }

  if (ability.promptsSecondTarget) {
    // Don't finalize yet — stash the primary target (e.g. the machine
    // being sacrificed) and prompt for a second target of the fixed type
    // the ability declares (e.g. 'enemy' who takes the resulting damage).
    secondTargetMode = { actor, ability, primaryTarget: target, secondTargetType: ability.promptsSecondTarget };
    selectedUnit = null; selectedAbility = null;
    updateStatus(`Agora escolha ${ability.promptsSecondTarget === 'ally' ? 'um aliado' : 'um inimigo'} para ${ability.name}.`);
    renderPartyRow(); renderAbilityRow(); renderTargetRings();
    return;
  }

  // Replace any existing plan entry for this actor
  playerPlan = playerPlan.filter(p => p.actor !== actor);
  playerPlan.push({ actor, ability, target });

  selectedUnit = null; selectedAbility = null;
  const remaining = livingPlayerUnits().filter(u => !planEntryFor(u));
  updateStatus(remaining.length > 0 ? `${ability.name} queued. Choose an ability for your next unit.` : `All units ready — tap FIGHT! to resolve the round`);
  renderPartyRow(); renderAbilityRow(); renderTargetRings();
}

// Called once the player picks the second (fixed-type) target, completing
// the plan entry: primary target plus the second target.
function finalizeSecondTargetPlan(secondTarget) {
  const { actor, ability, primaryTarget } = secondTargetMode;
  playerPlan = playerPlan.filter(p => p.actor !== actor);
  playerPlan.push({ actor, ability, target: primaryTarget, secondTarget });
  secondTargetMode = null;
  selectedUnit = null; selectedAbility = null;
  const remaining = livingPlayerUnits().filter(u => !planEntryFor(u));
  updateStatus(remaining.length > 0 ? `${ability.name} queued. Choose an ability for your next unit.` : `All units ready — tap FIGHT! to resolve the round`);
  renderPartyRow(); renderAbilityRow(); renderTargetRings();
}

// Called once the player picks a target for the echo ability, completing
// the whole plan entry: primary ability+target, plus the echo choice.
function finalizeEchoPlan(echoTarget) {
  const { actor, primaryAbility, primaryTarget, chosenEchoAbility } = echoSubMode;
  playerPlan = playerPlan.filter(p => p.actor !== actor);
  playerPlan.push({
    actor, ability: primaryAbility, target: primaryTarget,
    echo: { ability: chosenEchoAbility, target: echoTarget }
  });
  echoSubMode = null;
  selectedUnit = null; selectedAbility = null;
  const remaining = livingPlayerUnits().filter(u => !planEntryFor(u));
  updateStatus(remaining.length > 0 ? `${primaryAbility.name} + ${chosenEchoAbility.name} queued. Choose an ability for your next unit.` : `All units ready — tap FIGHT! to resolve the round`);
  renderPartyRow(); renderAbilityRow(); renderTargetRings();
}

// Called when the player taps an ability button while mid echo-sub-flow
// (picking WHICH ability to echo, before picking its target).
function selectEchoAbility(ability) {
  if (!echoSubMode || echoSubMode.chosenEchoAbility) return;
  echoSubMode.chosenEchoAbility = ability;
  // Echoed abilities always target an ally, regardless of the ability's
  // own default targetType (e.g. Yvrel's echo re-casts on a teammate).
  updateStatus(`Choose an ally for the echoed ${ability.name}`);
  renderAbilityRow();
  renderTargetRings();
}

// Cancels the echo sub-flow entirely (e.g. player selects a different unit
// mid-flow), discarding the primary choice too since it was never queued.
function cancelEchoSubMode() {
  echoSubMode = null;
  secondTargetMode = null;
}

// =============================================================
// ============ SPEED-ORDERED RESOLUTION PHASE ===================
// =============================================================
// Both sides' actions (already fully decided) are merged into one
// list and sorted by ability speed (higher speed = acts first).
// Each entry still runs through the SAME AnimationEngine.play()
// pipeline, whether it originated from the player's plan or the AI.

// beginResolutionPhase / retargetIfDead now loaded from js/resolution.js (v2)
const beginResolutionPhase = () => beginResolutionPhaseV2();

function checkGameOver() {
  if (CombatEngine.isTeamDefeated(playerUnits)) {
    showOverlay(false);
    return true;
  }
  if (CombatEngine.isTeamDefeated(enemyUnits)) {
    showOverlay(true);
    return true;
  }
  return false;
}

function showOverlay(won) {
  gameOver = true;
  inputLocked = true;
  const title = document.getElementById('overlay-title');
  const sub = document.getElementById('overlay-sub');
  title.textContent = won ? 'VICTORY' : 'DEFEAT';
  title.className = won ? 'win' : 'lose';
  sub.textContent = won ? 'Your squad held the battlefield.' : 'Your squad has fallen.';
  overlay.classList.add('show');
}

document.getElementById('restart-btn').addEventListener('click', () => initGame(lastChosenPlayerOrder));

// =============================================================
// ============ SECTION 11: IDLE ANIMATION LOOP + RENDER =========
// =============================================================

const clockObj = new THREE.Clock();

function updateIdle(unit, elapsed) {
  if (!unit.alive || !unit.idleActive) return;
  const t = elapsed + unit.idleClock;
  const bob = Math.sin(t * 2.2) * 0.045;
  unit.body.position.y = bob;
  unit.body.rotation.y = Math.sin(t * 1.3) * 0.06;
  if (unit.core) {
    const pulse = 0.35 + Math.sin(t * 3) * 0.15;
    if (unit.core.material) unit.core.material.emissiveIntensity = pulse;
  }
  if (unit.weapon) {
    unit.weapon.position.y += Math.sin(t * 2.6) * 0.0015;
  }
  // Character-specific idle flourish layered on top of the generic bob/pulse
  // above, if this character has one. Runs after so it can override rotation
  // axes the generic idle doesn't touch (e.g. Babawibby's extra sway).
  const profile = CHARACTER_ANIM_PROFILES[unit.defId];
  if (profile && profile.idleExtra) profile.idleExtra(unit, t);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clockObj.getDelta(), 0.05);
  const elapsed = clockObj.getElapsedTime();

  animRunner.tick(dt);
  updateParticles(dt);
  updateCameraOrbit(dt);
  updateCameraShake(dt);

  [...playerUnits, ...enemyUnits].forEach(u => updateIdle(u, elapsed));

  updateLabelPositions();
  if (!inputLocked) renderTargetRingsThrottled();

  renderer.render(scene, camera);
}

// Ring positions are recomputed every frame now (cheap: renderTargetRings
// repositions existing DOM nodes rather than recreating them, see the
// selectionChanged guard inside it). This used to be throttled to every
// 6th frame under the assumption the camera was static during planning,
// but that's no longer true now that the camera idly orbits during
// planning — throttling would make rings visibly lag behind their units.
function renderTargetRingsThrottled() {
  if (selectedUnit || document.querySelectorAll('.targetable-ring').length) {
    renderTargetRings();
  }
}

// =============================================================
// ============ BOOT ==============================================
// =============================================================

window.addEventListener('load', () => {
  document.getElementById('loading').style.display = 'none';
  openTeamSelect();
  animate();
});
</script>
